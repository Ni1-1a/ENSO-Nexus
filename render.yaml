# Render.com Blueprint — деплой backend+frontend одним web-сервисом.
# Порядок: положить содержимое папки enso-platform в git-репозиторий → Render → New → Blueprint.
services:
  - type: web
    name: enso-nexus-pilot1
    runtime: node
    plan: free            # бесплатный тариф: сервис засыпает после 15 минут простоя
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # значение задаётся вручную в дашборде Render, не хранится в git
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      # По умолчанию сервер слушает только 127.0.0.1 (server/config.js) — Render
      # ходит к процессу снаружи контейнера, поэтому нужен 0.0.0.0.
      - key: BIND_HOST
        value: 0.0.0.0
      - key: SESSION_TTL_HOURS
        value: "72"
      # На платном тарифе с persistent-диском добавьте:
      # - key: DATA_DIR
      #   value: /var/data
      # - key: USERS_FILE
      #   value: /var/data/users.json
# disk:                    # бесплатный тариф диски не поддерживает; данные эфемерны
#   name: data
#   mountPath: /var/data
#   sizeGB: 1
