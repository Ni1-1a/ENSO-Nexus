    - { cipher: "АС",  name: "объединение АР и КР (кроме КМ)", stage: "РД", source: "ГОСТ Р 21.101-2020, прил. Г, табл. Г.1" }
    - { cipher: "АР",  name: null, stage: "РД", source: "ГОСТ Р 21.101-2020, прил. Г, табл. Г.1" }
    - { cipher: "АИ",  name: "интерьеры", stage: "РД", source: "ГОСТ Р 21.101-2020, прил. Г, табл. Г.1" }
