# ============================================================================
# Разделы ПД/РД: номера по ПП 87, буквенные шифры по ГОСТ Р 21.101-2020
# Модуль «Нормоконтроль» ENSO Nexus. Собрано 2026-08-24 из извлечений
# Этапа 0 (D — ПП 87 ред. 15.09.2023; C, E — ГОСТ Р 21.101-2020, прил. Б и Г).
# ВАЖНО: в самом ПП 87 буквенных шифров разделов НЕТ — Положение оперирует
# только номерами разделов (правила оформления и шифры устанавливает
# Минстрой, п. 6 Положения). Буквенные шифры — приложение Б ГОСТ Р 21.101-2020.
# conflict: true — расхождения источников, см. decisions/conflicts.md.
# ============================================================================

# ----------------------------------------------------------------------------
# (а) Состав разделов ПД по ПП РФ № 87
# ----------------------------------------------------------------------------
pd_sections_pp87:
  source: "ПП РФ от 16.02.2008 № 87 «О составе разделов проектной документации и требованиях к их содержанию», редакция файла корпуса от 15.09.2023 (посл. изм. ПП № 1506)"
  notes:
    - "Буквенных шифров разделов в ПП 87 нет — только номера; шифры см. pd_ciphers_gost."
    - "Положение распространяется на ПД, подлежащую экспертизе по ст. 49 ГрК (п. 1)."
    - "ПД состоит из текстовой и графической частей и (или) материалов в форме информационной модели (п. 3); смета включается в случаях п. 3(4)."
    - "С 01.09.2024 (ПП № 589 от 06.05.2024): п. 10 «б» дополнен результатами применения способов обоснования по ч. 6 ст. 15 384-ФЗ; п. 10 «у», п. 34 «к», прил. 10 п. 2 «в» — перечень документов, обеспечивающих соблюдение техрегламентов (взамен перечня по отменённому ПП 815)."
    - "Редакция корпуса не последняя — актуальную редакцию сверять с Техэкспертом (conflict, см. decisions/conflicts.md)."

  # Объекты производственного и непроизводственного назначения — п. 3(1), 13 разделов
  capital_objects:
    basis: "ПП 87, п. 3(1)"
    sections:
      - number: 1
        name: "Пояснительная записка"
        mandatory: "обязателен"
        content: "ПП 87, п. 10"
      - number: 2
        name: "Схема планировочной организации земельного участка"
        mandatory: "обязателен"
        content: "ПП 87, п. 12"
      - number: 3
        name: "Объемно-планировочные и архитектурные решения"
        mandatory: "обязателен"
        content: "ПП 87, п. 13"
      - number: 4
        name: "Конструктивные решения"
        mandatory: "обязателен"
        content: "ПП 87, п. 14"
      - number: 5
        name: "Сведения об инженерном оборудовании, о сетях и системах инженерно-технического обеспечения"
        mandatory: "обязателен"
        content: "ПП 87, п. 15–21 (по подразделам)"
        subsections:  # п. 15
          - { letter: "а", name: "Система электроснабжения", content: "ПП 87, п. 16" }
          - { letter: "б", name: "Система водоснабжения" }
          - { letter: "в", name: "Система водоотведения" }
          - { letter: "г", name: "Отопление, вентиляция и кондиционирование воздуха, тепловые сети" }
          - { letter: "д", name: "Сети связи" }
          - { letter: "е", name: "Система газоснабжения" }
      - number: 6
        name: "Технологические решения"
        mandatory: "обязателен; для объектов непроизводственного назначения — только при наличии требования в задании на проектирование"
        content: "ПП 87, п. 22"
      - number: 7
        name: "Проект организации строительства (в т.ч. проект организации работ по сносу — при необходимости сноса для строительства/реконструкции)"
        mandatory: "обязателен"
        content: "ПП 87, п. 23, 25 (снос)"
      - number: 8
        name: "Мероприятия по охране окружающей среды"
        mandatory: "обязателен"
        content: "ПП 87, п. 26"
      - number: 9
        name: "Мероприятия по обеспечению пожарной безопасности"
        mandatory: "обязателен"
        content: "ПП 87, п. 26"
      - number: 10
        name: "Требования к обеспечению безопасной эксплуатации объектов капитального строительства"
        mandatory: "обязателен"
        content: "ПП 87, п. 26(1)"
      - number: 11
        name: "Мероприятия по обеспечению доступа инвалидов к объекту капитального строительства"
        mandatory: "обязателен"
        content: "ПП 87, п. 27"
      - number: 12
        name: "Смета на строительство, реконструкцию, капитальный ремонт, снос объекта капитального строительства"
        mandatory: "только в случаях п. 3(4): финансирование за счёт бюджетов бюджетной системы РФ / средств лиц по ст. 8.3 ГрК"
        content: "ПП 87, п. 28–31"
      - number: 13
        name: "Иная документация в случаях, предусмотренных законодательными и иными НПА РФ"
        mandatory: "обязателен (содержимое — по применимости; перечень примеров — п. 32)"
        content: "ПП 87, п. 32"

  # Линейные объекты — п. 3(2), 10 разделов
  linear_objects:
    basis: "ПП 87, п. 3(2)"
    sections:
      - number: 1
        name: "Пояснительная записка"
        mandatory: "обязателен"
        content: "ПП 87, п. 34"
      - number: 2
        name: "Проект полосы отвода"
        mandatory: "обязателен; разрабатывается в соответствии с проектом планировки территории (кроме случаев, когда ДПТ не требуется)"
        content: "ПП 87, п. 35"
      - number: 3
        name: "Технологические и конструктивные решения линейного объекта. Искусственные сооружения"
        mandatory: "обязателен"
        content: "ПП 87, п. 36"
      - number: 4
        name: "Здания, строения и сооружения, входящие в инфраструктуру линейного объекта"
        mandatory: "обязателен"
        content: "ПП 87, п. 37"
      - number: 5
        name: "Проект организации строительства (в т.ч. ПОР по сносу при необходимости)"
        mandatory: "обязателен"
        content: "ПП 87, п. 38"
      - number: 6
        name: "Мероприятия по охране окружающей среды"
        mandatory: "обязателен"
        content: "ПП 87, п. 40"
      - number: 7
        name: "Мероприятия по обеспечению пожарной безопасности"
        mandatory: "обязателен"
        content: "ПП 87, п. 41"
      - number: 8
        name: "Требования к обеспечению безопасной эксплуатации линейного объекта"
        mandatory: "обязателен"
        content: "ПП 87, п. 41(1)"
      - number: 9
        name: "Смета на строительство, реконструкцию, капитальный ремонт, снос объекта капитального строительства"
        mandatory: "только в случаях п. 3(4)"
        content: "ПП 87, п. 42 (отсылка к п. 28–31)"
      - number: 10
        name: "Иная документация в случаях, предусмотренных законодательными и иными НПА РФ"
        mandatory: "обязателен (по применимости)"
        content: "ПП 87, п. 42 (отсылка к п. 32)"

  # Реконструкция и капитальный ремонт — п. 3(3)
  reconstruction_capital_repair:
    basis: "ПП 87, п. 3(3)"
    rule: "Состав разделов определяется заказчиком в зависимости от содержания работ, с учётом п. 3(1)/3(2) и п. 3(4), и указывается в задании на проектирование."

  # Сокращённый состав для сетей газораспределения/газопотребления до 1,2 МПа
  gas_networks_special:
    basis: "приложение-«особенности» к ПП 87 для сетей газораспределения и (или) газопотребления давлением до 1,2 МПа включительно"
    rule: "ПД состоит из 7 разделов по особому перечню: 1 «Пояснительная записка»; 2 «Проект полосы отвода»; 3 «Технологические и конструктивные решения линейного объекта. Искусственные сооружения» (при наличии пунктов редуцирования, узлов учёта газа и др.); 4 «Проект организации строительства» (при наличии блочных ГРП на фундаменте, бестраншейных переходов >30 м, котлованов >3 м); раздел «Проект организации работ по сносу (демонтажу) линейного объекта» (при необходимости); раздел «Смета…» (по п. 28–31); раздел «Иная документация…» (ГО/ЧС, безопасная эксплуатация и др.)."
    conflict: true
    note: "В извлечении D приложение упоминается и как № 9 (кандидат в правила), и как № 10 (перечень приложений и изменения ПП 589); кроме того, в тексте файла пункты 6 и 7 приложения оба именуют раздел номером 5 — нумерацию сверить с официальным текстом, см. decisions/conflicts.md"

  # Прочие структурные правила состава (для перекрёстных проверок)
  misc:
    - "П. 7: иные разделы (не обязательные по Положению) — по заданию на проектирование."
    - "П. 8: необходимость ПД на отдельный этап строительства — по заданию; возможность этапа обосновывается расчётами."
    - "П. 4: рабочая документация = текстовые документы + рабочие чертежи + спецификации оборудования и изделий; состав РД Положением не регламентирован."
    - "10 приложений-«особенностей»: метрополитен; автомобильные дороги; железные дороги; линии связи; магистральные трубопроводы; инженерная защита при автодорогах; предприятия по добыче и первичной переработке твёрдых полезных ископаемых; ГТС, образующие водохранилища; атомные станции; сети газораспределения/газопотребления до 1,2 МПа."

# ----------------------------------------------------------------------------
# (б) Буквенные шифры разделов ПД — приложение Б ГОСТ Р 21.101-2020 (табл. Б.1)
# ----------------------------------------------------------------------------
pd_ciphers_gost:
  source: "ГОСТ Р 21.101-2020, приложение Б (рекомендуемое), таблица Б.1"
  notes:
    - "Номера разделов устанавливает ПП 87, стандарт задаёт только буквенные шифры; допускается латиница по СТО."
    - "Приложение Б соответствует редакции ПП 87 на 21.12.2020; после ПП № 963 (с 01.09.2022) наименования разделов изменились — приложение Б требует поправки (по обзору Сорокина Н.И.)."
    - "Шифры ИОС1–ИОС7 — это нумерация подразделов раздела ИОС по ПП 87; в табл. Б.1 стандарта пронумерованных подразделов нет (нумерация — по ПП 87)."
    - "Маппинг подразделов ИОС на новые ГОСТ Р (с 01.09.2023): система водоснабжения — ГОСТ Р 21.619; водоотведение — 21.620; ОВиК и тепловые сети — 21.621; системы электроснабжения — 21.622; сети связи — 21.618."
  ciphers:
    - { cipher: "ПЗ",   name: "Пояснительная записка", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ПЗУ",  name: "Схема планировочной организации земельного участка", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "АР",   name: "Архитектурные решения", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "КР",   name: "Конструктивные и объемно-планировочные решения", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ИОС",  name: "Сведения об инженерном оборудовании, о сетях инженерно-технического обеспечения…", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1", note: "подразделы нумеруются по ПП 87 (ИОС1–ИОС7 в практике)" }
    - { cipher: "ПОС",  name: "Проект организации строительства (в т.ч. линейного объекта)", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ПОД",  name: "Проект организации работ по сносу", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ООС",  name: "Перечень мероприятий по охране окружающей среды", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ПБ",   name: "Мероприятия по обеспечению пожарной безопасности", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ОДИ",  name: "Мероприятия по обеспечению доступа инвалидов", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ТБЭ",  name: "Требования к обеспечению безопасной эксплуатации", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ЭЭ",   name: "Мероприятия по энергоэффективности и приборам учёта", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "СМ",   name: "Смета на строительство", stage: "ПД", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ППО",  name: "Проект полосы отвода", stage: "ПД (линейные объекты)", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ТКР",  name: "Технологические и конструктивные решения линейного объекта. Искусственные сооружения", stage: "ПД (линейные объекты)", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ИЛО",  name: "Здания, строения и сооружения, входящие в инфраструктуру линейного объекта", stage: "ПД (линейные объекты)", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ГОЧС", name: "Перечень мероприятий по гражданской обороне и чрезвычайным ситуациям", stage: "ПД (раздел «Иная документация»)", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ДПБ",  name: "Декларация промышленной безопасности", stage: "ПД (раздел «Иная документация»)", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }
    - { cipher: "ДБГ",  name: "Декларация безопасности гидротехнических сооружений", stage: "ПД (раздел «Иная документация»)", source: "ГОСТ Р 21.101-2020, прил. Б, табл. Б.1" }

# ----------------------------------------------------------------------------
# (в) Марки основных комплектов рабочих чертежей — приложение Г ГОСТ Р 21.101-2020
# ----------------------------------------------------------------------------
rd_marks:
  source: "ГОСТ Р 21.101-2020, приложение Г (рекомендуемое), таблица Г.1"
  notes:
    - "Расшифровки марок в извлечениях Этапа 0 зафиксированы лишь частично (пометки в скобках у докладчика); отсутствующие наименования (name: null) добирать из таблицы Г.1 оригинала — не выдумывать."
    - "Дополнительные марки — не более трёх прописных букв русского алфавита; допускается латиница/цифровые коды по СТО."
    - "Специальные группы марок: проводные средства связи — по прил. А ГОСТ Р 21.1703 (действующий стандарт — ГОСТ Р 21.703-2020); автоматизация — по прил. А ГОСТ 21.408; гидромелиоративные сооружения — по прил. А ГОСТ 21.709."
    - "Объединения: АС = объединение АР и КР (кроме КМ); ЭОМ = объединение ЭМ и ЭО."
    - "Термин «охранно-пожарная сигнализация» в наименовании марки не использовать (СП 484.1311500.2020, п. 5.21)."
  conflict_note:
    conflict: true
    note: "Состав перечня марок расходится между извлечениями: C (из прил. Г стандарта) не содержит марок ЭП, ЭГ, ВП, МС, которые названы в B (D1/5 «Рекомендации по СПДС», таблица марок, с пометкой «и др.»); сверить с табл. Г.1 оригинала — см. decisions/conflicts.md"
