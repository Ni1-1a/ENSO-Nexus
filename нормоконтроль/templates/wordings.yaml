# =====================================================================
# wordings.yaml — библиотека типовых формулировок замечаний
# Модуль «Нормоконтроль» ENSO Nexus, Этап 1.
#
# Источники (Этап 0): extracts/B-рекомендации.md (МР-1989, МР-2024,
# ~30 типовых формулировок), extracts/A-ядро.md (ОСТ 108.001.17-82,
# образцы из ГОСТ 21.002-2014 и ГОСТ 21.002-81). Ничего сверх извлечений.
#
# Схема записи:
#   code          источник-классификатор + код («МР2024-101», «МР1989-1.01»,
#                 «ОСТ108-001»); формулировки без кода — WRD-NNN
#   text          формулировка как в источнике
#   source        документ-источник
#   weight        коэффициент весомости (если указан в источнике)
#   severity_hint условная проекция весомости: 0,2 → minor; 0,5 → major;
#                 1,0 → critical; 2,0 → critical. Рабочая конвенция,
#                 финальное решение — decisions/open-questions.md
#   topic         тематическая рубрика
#   note          служебные пометки (оговорки извлечения)
#
# CONFLICT: две редакции классификатора (МР-1989 прил. 3, коды X.YY и
# МР-2024 прил. Г, коды XYY) — см. decisions/conflicts.md. Обе включены
# целиком. В извлечении B тексты сведены в одну таблицу с пометками
# редакций; здесь тексты разнесены по редакциям, восстановленные места
# помечены в note («сверить с оригиналом»).
# =====================================================================

