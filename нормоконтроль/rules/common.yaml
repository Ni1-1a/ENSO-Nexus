    ntd: ГОСТ Р 21.101-2020
    clause: "5.3.2, 5.3.3, 5.3.4"
  check:
    type: format
    description: Для каждого здания/сооружения — самостоятельная система обозначения осей; цифры слева направо, прописные буквы русского алфавита (кроме исключённых) снизу вверх; обозначения наносят по левой и нижней сторонам плана.
  auto: llm
  wording: "Обозначения координационных осей не соответствуют установленной системе: арабские цифры слева направо, буквы русского алфавита (кроме исключённых) снизу вверх, по левой и нижней сторонам плана (ГОСТ Р 21.101-2020, пп. 5.3.2–5.3.4)."
  fix_hint: Перемаркировать оси в установленной последовательности и разместить марки по левой и нижней сторонам.

- id: COM-GR-003
  title: Обозначение дополнительных осей
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "5.3.5"
  check:
    type: format
    description: Дополнительным осям между основными присваивается обозначение дробью — номер предшествующей оси и порядковый номер дополнительной оси.
  auto: llm
  wording: "Обозначение дополнительных координационных осей выполнено не в виде дроби с номером предшествующей оси (ГОСТ Р 21.101-2020, п. 5.3.5)."
  fix_hint: Обозначить дополнительные оси дробью (числитель — предшествующая ось, знаменатель — порядковый номер).

- id: COM-GR-004
  title: Нанесение линейных размеров
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "5.4.1, 5.4.2"
  check:
    type: format
    description: Линейные размеры — без обозначения единиц (мм по умолчанию; м — где установлено); размерные линии ограничиваются засечками 2–4 мм с наклоном вправо под 45°, размерная линия выступает за выносные на 1–3 мм.
  auto: llm
  wording: "Нанесение размеров не соответствует правилам: линейные размеры указывают без обозначения единиц, размерные линии ограничивают засечками длиной 2–4 мм под 45° (ГОСТ Р 21.101-2020, пп. 5.4.1, 5.4.2)."
  fix_hint: Исправить нанесение размеров и засечек по пп. 5.4.1, 5.4.2.

- id: COM-GR-005
  title: Отметки уровней и уклоны
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "5.4.3, 5.4.4"
  check:
    type: format
    description: Отметки уровней указываются в метрах с тремя десятичными знаками (за нулевую, как правило, принимается уровень чистого пола первого этажа); уклоны на планах — стрелкой с указанием значения в процентах или иных установленных единицах.
  auto: llm
  wording: "Отметки уровней/уклоны нанесены с нарушением: отметки указывают в метрах с тремя десятичными знаками, уклоны — стрелкой со значением (ГОСТ Р 21.101-2020, пп. 5.4.3, 5.4.4)."
  fix_hint: Привести отметки к формату «0,000» (м, три знака), уклоны — к установленному обозначению.

- id: COM-GR-006
  title: Номера позиций и размер шрифта марок
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "5.4.5, 5.4.7"
  check:
    type: format
    description: Номера позиций (марки элементов) наносятся на полках линий-выносок; размер шрифта обозначений осей и позиций — в 1,5–2 раза больше размера цифр размерных чисел того же чертежа.
  auto: llm
  wording: "Номера позиций (марки элементов) нанесены не на полках линий-выносок либо размер шрифта обозначений осей и позиций не превышает размер размерных чисел в 1,5–2 раза (ГОСТ Р 21.101-2020, пп. 5.4.5, 5.4.7)."
  fix_hint: Нанести позиции на полках линий-выносок шрифтом в 1,5–2 раза крупнее размерных чисел.

- id: COM-GR-007
  title: Выполнение изображений по ГОСТ 2.305
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
