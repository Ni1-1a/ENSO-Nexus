- id: COM-GR-001
  title: Нанесение координационных осей
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "5.3.1"
  check:
    type: format
    description: На изображениях указываются координационные оси несущих конструкций — штрихпунктирными тонкими линиями с марками в кружках.
  auto: llm
  wording: "Координационные оси не нанесены или нанесены с нарушением: оси выполняют штрихпунктирными линиями с обозначениями в кружках (ГОСТ Р 21.101-2020, п. 5.3.1)."
  fix_hint: Нанести координационные оси установленным образом.

- id: COM-GR-002
  title: Система и последовательность обозначений осей
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
