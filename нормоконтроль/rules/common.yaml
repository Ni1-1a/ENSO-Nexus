- id: COM-EDOC-001
  title: Комплектование ПДЭ (пакет электронных документов)
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "8.2.1, 8.2.2"
  check:
    type: format
    description: Для передачи другой организации копии ДЭ комплектуются в ПДЭ (zip-архив или общая папка); наименование архива/папки — обозначение и/или наименование объекта; состав ПДЭ — реквизитная часть (описание структуры) и содержательная часть (структурированный набор папок и файлов).
  auto: deterministic
  wording: "Пакет электронных документов сформирован с нарушением: наименование архива/папки не соответствует обозначению объекта либо отсутствует реквизитная или содержательная часть (ГОСТ Р 21.101-2020, пп. 8.2.1, 8.2.2)."
  fix_hint: Сформировать ПДЭ из реквизитной и содержательной частей с наименованием по обозначению объекта.

- id: COM-EDOC-002
  title: Реквизитная часть ПДЭ — файл info.xml
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "8.2.3"
  check:
    type: format
    description: Реквизитная часть ПДЭ — XML-документ с фиксированным именем файла info.xml, содержащий информацию о пакете, структуре и атрибутах (таблицы Ф.1–Ф.9 приложения Ф), пригодный для автозагрузки в СЭД.
  auto: deterministic
  wording: "В пакете электронных документов отсутствует или некорректен файл реквизитной части info.xml (ГОСТ Р 21.101-2020, п. 8.2.3, приложение Ф)."
  fix_hint: Сформировать info.xml по структуре таблиц Ф.1–Ф.9.

- id: COM-EDOC-003
  title: Уникальный идентификатор (GUID) документов ПДЭ
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "8.2.4"
  check:
    type: format
    description: Каждый документ ПДЭ имеет глобальный уникальный идентификатор (GUID), неизменный между версиями документа.
  auto: deterministic
  wording: "Документ ПДЭ не имеет GUID либо GUID изменён между версиями документа (ГОСТ Р 21.101-2020, п. 8.2.4)."
  fix_hint: Присвоить документам GUID и сохранять его при выпуске новых версий.

- id: COM-EDOC-004
