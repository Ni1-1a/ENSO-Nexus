  wording: "Одинаковые планы этажей выполнены многократно: повторяющиеся планы выполняют один раз с указанием номеров этажей в наименовании (ГОСТ Р 21.101-2020, пп. 5.5.12, 5.5.13)."
  fix_hint: Объединить повторяющиеся планы в один с перечислением этажей.

- id: COM-GR-011
  title: Наименования изображений
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
