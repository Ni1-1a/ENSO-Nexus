  auto: llm
  wording: "Изображения выполнены с нарушением ГОСТ 2.305 либо расположены на листе не в порядке нумерации (ГОСТ Р 21.101-2020, п. 5.5.1)."
  fix_hint: Выполнить и расположить изображения по ГОСТ 2.305 в порядке нумерации.

- id: COM-GR-008
  title: Нумерация разрезов и других изображений
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "5.5.2, 5.5.6"
  check:
    type: format
    description: Разрезы обозначаются арабскими цифрами последовательно; для каждого вида изображений (разрезы/сечения, узлы, фрагменты) — самостоятельная сквозная нумерация без пропусков.
  auto: llm
  wording: "Нарушена нумерация изображений: разрезы обозначают арабскими цифрами последовательно, для каждого вида изображений применяют самостоятельную нумерацию (ГОСТ Р 21.101-2020, пп. 5.5.2, 5.5.6)."
  fix_hint: Перенумеровать изображения последовательно в пределах каждого вида.

- id: COM-GR-009
  title: Оформление узлов
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "5.5.4"
  check:
    type: format
    description: Место узла отмечается замкнутой сплошной тонкой линией с обозначением на полке линии-выноски; над изображением вынесенного узла — обозначение в двойном кружке (с номером листа при размещении на другом листе).
  auto: llm
  wording: "Оформление узлов не соответствует правилам: отметка узла замкнутой тонкой линией с обозначением на полке линии-выноски, маркировка узла в двойном кружке (ГОСТ Р 21.101-2020, п. 5.5.4)."
  fix_hint: Оформить отметки и маркировку узлов установленным образом.

- id: COM-GR-010
  title: Повторяющиеся планы выполняются один раз
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: remark
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "5.5.12, 5.5.13"
  check:
    type: format
    description: "Повторяющиеся планы этажей выполняются один раз с перечислением этажей в наименовании («План 2–9 этажей»); при малых отличиях полностью выполняется один план, для остальных показываются только отличия."
