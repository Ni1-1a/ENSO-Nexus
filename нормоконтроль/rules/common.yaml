  auto: deterministic
  wording: "Ведомость рабочих чертежей основного комплекта не соответствует фактическому составу листов комплекта (ГОСТ Р 21.101-2020, п. 4.3.2)."
  fix_hint: Привести ведомость в соответствие с составом и наименованиями листов.

- id: COM-GEN-003
  title: Ведомость ссылочных и прилагаемых документов
