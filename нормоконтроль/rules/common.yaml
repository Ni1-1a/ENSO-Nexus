# ---------------------------------------------------------------------

- id: COM-REF-001
  title: Наличие и правильность ссылок на НТД
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ 21.002-2014
    clause: "5.2, таблица 1, п. 1е"
  check:
    type: reference
    description: Проверить наличие и правильность ссылок на технические регламенты, стандарты и другие нормативные документы (корректные обозначения, существующие документы).
  auto: llm
  wording: "Отсутствуют или неверны ссылки на технические регламенты, стандарты и другие нормативные документы (ГОСТ 21.002-2014, таблица 1, п. 1е)."
  fix_hint: Указать корректные обозначения НТД; проверить каждую ссылку по реестру НТД.

- id: COM-REF-002
  title: Актуальность ссылочных нормативных документов
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: РД 52.18.617-2015
    clause: "7.1 (перечисление ж)"
  check:
    type: reference
    description: Проверить сроки действия ссылочных НД по реестру НТД — ссылки на отменённые/заменённые документы не допускаются.
  auto: deterministic
  wording: "Ссылка на нормативный документ, утративший силу (отменён/заменён). Ссылочные документы должны быть действующими (РД 52.18.617-2015, п. 7.1)."
  fix_hint: Заменить ссылку на действующую редакцию документа-преемника.

- id: COM-REF-003
  title: Правильность внутренних ссылок
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: РД 52.18.617-2015
    clause: "7.1 (перечисление е)"
  check:
    type: reference
    description: Проверить правильность ссылок внутри документа — на разделы, пункты, приложения, таблицы, рисунки (адресат существует, номера корректны).
  auto: deterministic
  wording: "Ссылка на несуществующий или неверно указанный структурный элемент документа (раздел, приложение, таблицу) (РД 52.18.617-2015, п. 7.1)."
  fix_hint: Исправить номера ссылок на фактические структурные элементы.

- id: COM-REF-004
  title: Перечень документов по соблюдению техрегламентов в ПЗ
  scope: document
  applies_to: [ПЗ]
  stage: [П]
  severity: major
  source:
    ntd: ПП РФ от 16.02.2008 № 87 (в ред. ПП РФ от 06.05.2024 № 589)
    clause: "10 (подпункт «у»)"
  check:
    type: presence
    description: С 01.09.2024 пояснительная записка содержит перечень документов, в результате применения которых обеспечивается соблюдение требований технических регламентов и иных требований по п. 1 ч. 5 ст. 49 ГрК (взамен ссылок на отменённый перечень ПП 815).
  auto: deterministic
  wording: "В пояснительной записке отсутствует перечень документов, в результате применения которых обеспечивается соблюдение требований технических регламентов (ПП РФ № 87, п. 10 «у» в ред. ПП № 589)."
  fix_hint: Включить в ПЗ перечень применённых документов по стандартизации; ссылки на перечни ПП 985/815 исключить.

- id: COM-REF-005
  title: Обоснование соответствия требованиям 384-ФЗ
  scope: document
  applies_to: [все]
  stage: [П]
  severity: major
  source:
    ntd: Федеральный закон от 30.12.2009 № 384-ФЗ
    clause: "ч. 5.1 ст. 15"
  check:
    type: presence
    description: Соответствие проектных решений требованиям 384-ФЗ обосновывается в ПД с указанием положений закона и конкретных документов из ст. 6 (стандарты/СП, СТО, результаты применения способов обоснования по ч. 6 ст. 15).
  auto: llm
  wording: "В проектной документации не приведено обоснование соответствия проектных значений требованиям безопасности со ссылками на применённые документы (384-ФЗ, ч. 5.1 ст. 15)."
  fix_hint: Дополнить текстовую часть обоснованием со ссылками на применённые стандарты/СП или результаты альтернативных способов обоснования.

- id: COM-REF-006
  title: Неприменение добровольных документов не является нарушением
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: remark
  source:
    ntd: Федеральный закон от 27.12.2002 № 184-ФЗ
    clause: "ч. 4 ст. 16.1"
  check:
    type: reference
    description: "Мета-правило севèрити: несоответствие документу добровольного перечня само по себе не квалифицируется как нарушение техрегламента; при неприменении добровольного документа проверяется наличие обоснования по ч. 6 ст. 15 384-ФЗ (исследования, расчёты/испытания, моделирование, оценка риска)."
  auto: llm
  wording: "Неприменение документов добровольного перечня не может оцениваться как несоблюдение требований технических регламентов (184-ФЗ, ч. 4 ст. 16.1); при этом соответствие должно быть обосновано способами по ч. 6 ст. 15 384-ФЗ."
  fix_hint: При отступлении от добровольного документа приложить обоснование альтернативного решения; замечание квалифицировать не выше remark при наличии обоснования.

- id: COM-REF-007
  title: Обязательность требований по реестру требований
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: remark
  source:
    ntd: Федеральный закон от 30.12.2009 № 384-ФЗ (в ред. 653-ФЗ)
    clause: "ч. 2 ст. 6"
  check:
    type: reference
    description: "Мета-правило выбора нормативной базы: обязательность требований определяется по реестру требований (ПП РФ № 1417), а не по отменённым перечням ПП 985/815; при проверке ссылок статус пункта СП/ГОСТ берётся из реестра."
  auto: deterministic
  wording: "Обязательные требования применяются со дня включения в реестр требований; проверка обязательности по отменённым перечням (ПП 985, ПП 815) не допускается (384-ФЗ, ч. 2 ст. 6)."
  fix_hint: Настроить проверку обязательности пунктов НТД по актуальному реестру требований.

# ---------------------------------------------------------------------
# CHG — внесение изменений (ГОСТ Р 21.101-2020 разд. 7, ГрК РФ, ПП 145)
# ---------------------------------------------------------------------

- id: COM-CHG-001
  title: Изменение без изменения обозначения документа
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.1.2, 7.1.3"
  check:
    type: consistency
    description: Изменение — любое исправление, исключение или добавление данных без изменения обозначения документа; обозначение меняется только при ошибочно одинаковых обозначениях или ошибке в обозначении; если изменение неприемлемо — выпускается новый документ с новым обозначением.
  auto: llm
  wording: "При внесении изменений изменено обозначение документа. Изменения вносят без изменения обозначения; при неприемлемости изменения выпускают новый документ с новым обозначением (ГОСТ Р 21.101-2020, пп. 7.1.2, 7.1.3)."
  fix_hint: Сохранить прежнее обозначение изменяемого документа либо оформить выпуск нового документа.

- id: COM-CHG-002
  title: Запрет внесения изменений в расчёты
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.1.2"
  check:
    type: presence
    description: В документах-расчётах (шифр РР) не допускаются отметки об изменениях; при необходимости выполняются новые расчёты с новым обозначением с сохранением ранее выполненных и указанием об их замене.
  auto: deterministic
  wording: "В расчёты внесены изменения. Внесение изменений в расчёты не допускается; выполняют новые расчёты с новым обозначением при сохранении ранее выполненных (ГОСТ Р 21.101-2020, п. 7.1.2)."
  fix_hint: Выпустить новый расчёт с новым обозначением, прежний сохранить с указанием о замене.

- id: COM-CHG-003
  title: Одновременное изменение взаимосвязанных документов
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.1.4"
  check:
    type: consistency
    description: Изменение, вызывающее изменения в других документах, сопровождается одновременным внесением изменений во все взаимосвязанные документы.
  auto: llm
  wording: "Любое изменение в документе, вызывающее какие-либо изменения в других документах, должно одновременно сопровождаться внесением соответствующих изменений во все взаимосвязанные документы (ГОСТ Р 21.101-2020, п. 7.1.4)."
  fix_hint: Внести согласованные изменения во все связанные документы одним изменением.

- id: COM-CHG-004
  title: Фиксация факта изменения в таблицах
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.1.6"
  check:
    type: presence
    description: Информация о факте изменения указывается в таблице изменений основной надписи и/или таблице регистрации изменений; для документов без основной надписи — в нижнем колонтитуле.
  auto: deterministic
  wording: "Факт изменения документа не отражён в таблице изменений основной надписи и/или таблице регистрации изменений (ГОСТ Р 21.101-2020, п. 7.1.6)."
  fix_hint: Заполнить таблицу изменений (таблицу регистрации изменений) по каждому внесённому изменению.

- id: COM-CHG-005
  title: Разрешение на внесение изменений (форма 9)
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.2.1, 7.2.5"
  check:
    type: presence
    description: Изменение (в т.ч. аннулирование) выполняется только на основании разрешения на внесение изменений по форме 9 (приложение Л); для ДЭ разрешение допускается не оформлять при ведении версий и контроле доступа в САПР/СЭД.
  auto: deterministic
  wording: "Изменение внесено без разрешения на внесение изменений. Изменение, в том числе аннулирование, выполняют на основании разрешения по форме 9 (ГОСТ Р 21.101-2020, п. 7.2.1)."
  fix_hint: Оформить разрешение по форме 9 (либо подтвердить версионность и контроль доступа СЭД для ДЭ).

- id: COM-CHG-006
  title: Порядковая нумерация изменений
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.3.1"
  check:
    type: format
    description: Изменения нумеруются порядковыми номерами без пропусков; один номер присваивается всем изменениям, вносимым по одному разрешению.
  auto: deterministic
  wording: "Нарушена порядковая нумерация изменений: один порядковый номер присваивают всем изменениям по одному разрешению, пропуски номеров не допускаются (ГОСТ Р 21.101-2020, п. 7.3.1)."
  fix_hint: Присвоить изменениям последовательные номера по разрешениям.

- id: COM-CHG-007
  title: Изменение электронного документа — новая версия
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.3.2, 7.3.7"
  check:
    type: format
    description: Изменение подлинника ДЭ индексируется как новая версия документа; при визуализации изменённые участки допускается помечать вертикальной чертой слева.
  auto: deterministic
  wording: "Изменение электронного документа выполнено без выпуска новой версии (ГОСТ Р 21.101-2020, пп. 7.3.2, 7.3.7)."
  fix_hint: Выпустить новую версию ДЭ с данными об изменении в реквизитной части.

- id: COM-CHG-008
  title: Способы изменения бумажных подлинников
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.3.4, 7.3.5"
  check:
    type: format
    description: "Изменения бумажных подлинников: зачёркивание, подчистка (смывка), закрашивание белым, введение новых данных, замена листов/документа, введение дополнительных листов, исключение листов; подлинник должен оставаться пригодным для репрографии; рукописный способ — по правилам приложения М."
  auto: manual
  wording: "Изменения в бумажный подлинник внесены способом, не предусмотренным стандартом, либо подлинник утратил пригодность для репрографии (ГОСТ Р 21.101-2020, пп. 7.3.4, 7.3.5, приложение М)."
  fix_hint: Внести изменения установленным способом (при рукописном — по приложению М) с сохранением читаемости подлинника.

- id: COM-CHG-009
  title: Замена листов подлинника
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.3.6"
  check:
    type: format
    description: При внесении изменений заменой листов изготовляются новые листы подлинника с учётом изменений; при замене всех листов заполняется графа «Взам. инв. №».
  auto: deterministic
  wording: "Замена листов подлинника оформлена с нарушением: при замене всех листов заполняют графу «Взам. инв. №» (ГОСТ Р 21.101-2020, п. 7.3.6)."
  fix_hint: Оформить заменённые листы и заполнить графу «Взам. инв. №» при полной замене.

- id: COM-CHG-010
  title: Изменения сметной документации — заменой документа
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.3.8"
  check:
    type: format
    description: Изменения в сметную документацию вносятся автоматизированным способом с заменой всего документа.
  auto: deterministic
  wording: "Изменения в сметную документацию внесены без замены всего документа (ГОСТ Р 21.101-2020, п. 7.3.8)."
  fix_hint: Выпустить сметный документ заново взамен изменённого.

- id: COM-CHG-011
  title: Нумерация добавляемых и аннулируемых листов
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.3.9, 7.3.10"
  check:
    type: format
    description: При добавлении листа в бумажный текстовый документ допускается номер предыдущего листа с добавлением строчной буквы или цифры через точку (3а, 3.1); при аннулировании листа нумерация последующих сохраняется; при изменении количества листов исправляется графа «Листов» первого листа. В электронный текстовый документ листы не добавляются — выпускается новая версия.
  auto: deterministic
  wording: "Нумерация добавленных/аннулированных листов либо графа «Листов» первого листа оформлены с нарушением (ГОСТ Р 21.101-2020, пп. 7.3.9, 7.3.10)."
  fix_hint: Присвоить добавленным листам номера вида «3а»/«3.1», сохранить нумерацию при аннулировании, исправить графу «Листов».

- id: COM-CHG-012
  title: Заполнение таблицы изменений
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.3.11, 7.3.12, 7.3.13"
  check:
    type: format
    description: "Данные об изменениях указываются в таблице изменений основной надписи: «Изм.» — номер изменения; «Кол. уч.» — количество изменяемых участков (при замене листа — прочерк); «Лист» — «Зам.»/«Нов.»/«Все»/прочерк; «№ док.» — обозначение разрешения; «Подп.»; «Дата»; таблицы заполняются на установленных листах."
  auto: deterministic
  wording: "Графы таблицы изменений заполнены неверно (ГОСТ Р 21.101-2020, пп. 7.3.11–7.3.13)."
  fix_hint: Заполнить графы «Изм.», «Кол. уч.», «Лист», «№ док.», «Подп.», «Дата» по правилам п. 7.3.13.

- id: COM-CHG-013
  title: Таблица регистрации изменений (форма 10)
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.3.14"
  check:
    type: format
    description: Для текстовых документов таблица регистрации изменений выполняется по форме 10; при её ведении для документа с основными надписями заполняются и таблицы изменений в основных надписях.
  auto: deterministic
  wording: "Таблица регистрации изменений отсутствует или выполнена не по форме 10 (ГОСТ Р 21.101-2020, п. 7.3.14)."
  fix_hint: Оформить таблицу регистрации изменений по форме 10.

- id: COM-CHG-014
  title: Оформление заменённых и аннулированных листов
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.3.15, 7.3.16"
  check:
    type: format
    description: Листы, выпущенные вместо заменённых, подписываются в графах 10–13 основной надписи; на аннулированных/заменённых листах подлинника проставляется штамп «Аннулирован (заменен)» с номером изменения.
  auto: deterministic
  wording: "Листы, выпущенные взамен заменённых, не подписаны, либо на аннулированных (заменённых) листах отсутствует штамп «Аннулирован (заменен)» (ГОСТ Р 21.101-2020, пп. 7.3.15, 7.3.16)."
  fix_hint: Подписать новые листы и проставить штамп на аннулированных/заменённых листах подлинника.

- id: COM-CHG-015
  title: Изменения — самостоятельно в пределах каждого документа
  scope: document
  applies_to: [все]
  stage: [П]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.4.1"
  check:
    type: format
    description: Изменения в документы разделов, подразделов, частей вносятся самостоятельно в пределах каждого документа независимо от их комплектации в тома; понятие «изменение тома» стандартом не предусмотрено.
  auto: llm
  wording: "Изменения оформлены «на том» в целом: изменения в документы вносят самостоятельно в пределах каждого документа независимо от их комплектации (ГОСТ Р 21.101-2020, п. 7.4.1)."
  fix_hint: Оформить изменения по каждому изменяемому документу отдельно.

- id: COM-CHG-016
  title: Оперативные изменения при экспертизе по журналу изменений
  scope: document
  applies_to: [все]
  stage: [П]
  severity: remark
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.4.3, приложение П"
  check:
    type: presence
    description: При проведении экспертизы допускается оперативное внесение изменений на основании журнала изменений (приложение П) с последующим выпуском разрешения; возможность применения согласуется с органом экспертизы.
  auto: llm
  wording: "Оперативные изменения при экспертизе внесены без ведения журнала изменений и последующего выпуска разрешения (ГОСТ Р 21.101-2020, п. 7.4.3, приложение П)."
  fix_hint: Вести журнал изменений и выпустить разрешение по завершении экспертизы.

- id: COM-CHG-017
  title: Отражение изменений ПД в ведомостях и содержании тома
  scope: document
  applies_to: [все]
  stage: [П]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.4.4, 7.4.5, 7.4.6, 7.4.7"
  check:
    type: consistency
    description: Изменения документов ПД отражаются в графе «Примечание» ведомости (документов) графической части, в содержании тома (номер изменения содержания = номеру изменения тома) и, при изменении состава томов, в ведомости «Состав проектной документации».
  auto: deterministic
  wording: "Внесение изменений в документы ПД не отражено в ведомостях графической части, содержании тома или ведомости «Состав проектной документации» (ГОСТ Р 21.101-2020, пп. 7.4.4–7.4.7)."
  fix_hint: Исправить содержание тома, ведомости графической части и «Состав проектной документации» одновременно с изменением документов.

- id: COM-CHG-018
  title: Пометки об изменениях в ведомости рабочих чертежей
  scope: document
  applies_to: [все]
  stage: [Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.5.2"
  check:
    type: format
    description: "В графе «Примечание» ведомости рабочих чертежей указывают: для изменённых листов — «Изм. 1» (последующие через точку с запятой), для заменённых — «(Зам.)», для аннулированных — «(Аннул.)», для дополнительных — «(Нов.)»."
  auto: deterministic
  wording: "Пометки об изменениях листов в ведомости рабочих чертежей отсутствуют или не соответствуют формам «Изм. N», «(Зам.)», «(Аннул.)», «(Нов.)» (ГОСТ Р 21.101-2020, п. 7.5.2)."
  fix_hint: Проставить установленные пометки в графе «Примечание» ведомости.

- id: COM-CHG-019
  title: Дополнительные листы основного комплекта
  scope: document
  applies_to: [все]
  stage: [Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.5.3"
  check:
    type: format
    description: Дополнительным листам присваиваются очередные порядковые номера с записью в продолжение ведомости рабочих чертежей; присваивать дополнительным листам номера аннулированных листов не допускается.
  auto: deterministic
  wording: "Дополнительным листам присвоены номера ранее аннулированных листов либо листы не записаны в продолжение ведомости рабочих чертежей (ГОСТ Р 21.101-2020, п. 7.5.3)."
  fix_hint: Присвоить дополнительным листам очередные номера и дописать их в ведомость.

- id: COM-CHG-020
  title: Отражение изменений состава комплектов в ведомостях
  scope: document
  applies_to: [все]
  stage: [Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "7.5.5, 7.5.6"
  check:
    type: consistency
    description: При дополнении/аннулировании прилагаемых документов исправляется раздел «Прилагаемые документы» ведомости ссылочных и прилагаемых документов; при дополнении/аннулировании основных комплектов — ведомость основных комплектов.
  auto: deterministic
  wording: "Изменение состава прилагаемых документов или основных комплектов не отражено в соответствующих ведомостях (ГОСТ Р 21.101-2020, пп. 7.5.5, 7.5.6)."
  fix_hint: Исправить ведомости одновременно с изменением состава документации.

- id: COM-CHG-021
  title: Изменения ПД без повторной экспертизы — условия и справка
  scope: document
  applies_to: [все]
  stage: [П]
  severity: major
  source:
    ntd: Градостроительный кодекс РФ; ПП РФ от 05.03.2007 № 145
    clause: "ч. 3.8 ст. 49 ГрК; п. 44(2) ПП 145"
  check:
    type: presence
    description: Изменения в ПД, получившую положительное заключение, вносимые без повторной экспертизы, подтверждаются ГИП на одновременное соответствие всем условиям ч. 3.8 ст. 49 ГрК; при направлении на повторную экспертизу к заявлению прилагается справка с описанием изменений за подписью ГИП.
  auto: manual
  wording: "Изменения в ПД внесены без подтверждения ГИП соответствия условиям ч. 3.8 ст. 49 ГрК РФ (либо отсутствует справка ГИП с описанием изменений при повторной экспертизе — п. 44(2) ПП РФ № 145)."
  fix_hint: Оформить подтверждение ГИП по ч. 3.8 ст. 49 ГрК либо направить изменённую ПД на повторную экспертизу со справкой об изменениях.

