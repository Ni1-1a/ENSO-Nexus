  auto: deterministic
  wording: "Структура папок или имена файлов ПДЭ не соответствуют составу документации и правилам наименования (разделитель «_», обозначение и номер листа в имени) (ГОСТ Р 21.101-2020, пп. 8.2.5, 8.2.6)."
  fix_hint: Переименовать папки/файлы по правилам 8.2.5, 8.2.6.

- id: COM-EDOC-005
  title: Форматы электронных документов для экспертизы
  scope: document
  applies_to: [все]
  stage: [П]
  severity: critical
  source:
    ntd: Приказ Минстроя России от 12.05.2017 № 783/пр
    clause: "2, 3"
  check:
    type: format
    description: "Электронные документы представляются в формате xml по действующим схемам с сайта Минстроя; при отсутствии схемы: doc/docx/odt — текст без формул; pdf — текст с формулами/графикой и графические документы; xls/xlsx/ods — сметные документы."
  auto: deterministic
  wording: "Формат электронного документа не соответствует требованиям: xml по схеме Минстроя, при отсутствии схемы — doc/docx/odt, pdf, xls/xlsx/ods (приказ № 783/пр, пп. 2, 3)."
  fix_hint: Пересохранить документы в требуемых форматах; проверить наличие действующей xml-схемы.

- id: COM-EDOC-006
  title: Поиск по тексту, оглавление, запрет сканов ПД
  scope: document
  applies_to: [все]
  stage: [П]
  severity: critical
  source:
    ntd: Приказ Минстроя России от 12.05.2017 № 783/пр
    clause: "4 (подпункты «а», «в», «г»)"
  check:
    type: format
    description: Электронные документы ПД формируются без сканирования с бумажного носителя, обеспечивают поиск по текстовому содержанию и копирование текста; структурированные документы содержат оглавление и закладки.
  auto: deterministic
  wording: "Электронный документ не обеспечивает возможность поиска по текстовому содержанию и копирования текста (растровый скан) либо не содержит оглавления и закладок (приказ № 783/пр, п. 4)."
  fix_hint: Сформировать документ из исходного файла с текстовым слоем, добавить оглавление и закладки.

- id: COM-EDOC-007
  title: Файл на каждый раздел ПД, наименование, предел 80 МБ
  scope: document
  applies_to: [все]
  stage: [П]
  severity: major
  source:
    ntd: Приказ Минстроя России от 12.05.2017 № 783/пр
    clause: "4 (подпункты «д», «е»), 5"
  check:
    type: format
    description: "Файлы формируются отдельно на каждый раздел (подраздел) ПД и содержат в названии слова «Раздел ПД N» / «подраздел ПД N»; размер файла — не более 80 МБ (при превышении — деление на файлы «…Фрагмент N»)."
  auto: deterministic
  wording: "Файлы разделов ПД не соответствуют требованиям: файл формируется на каждый раздел (подраздел) с наименованием «Раздел ПД N…» и размером не более 80 МБ (приказ № 783/пр, п. 4)."
  fix_hint: Разделить документы по разделам, переименовать файлы, крупные файлы разбить на фрагменты.

- id: COM-EDOC-008
  title: Требования к сканируемым документам (ИРД, УЛ)
  scope: document
  applies_to: [все]
  stage: [П]
  severity: minor
