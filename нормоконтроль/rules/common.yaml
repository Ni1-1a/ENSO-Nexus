# =====================================================================
# ENSO Nexus — модуль «Нормоконтроль», Этап 1
# rules/common.yaml — общие правила оформления и проверки ПД/РД,
# применимые ко всем разделам.
#
# Происхождение: собрано 2026-08-24 исключительно из извлечений Этапа 0
# (scratchpad/этап0/extracts/A-ядро.md, B-рекомендации.md, C-доклады.md,
# D-нпа.md, E-стандарты.md); номера пунктов сверены по каркасу
# ГОСТ Р 21.101-2020 (E) и OCR полного текста (tmp-E/ГОСТ Р 21.101-2020__ocr.txt).
# Кандидаты без подтверждённого пункта НТД не включены — см.
# scratchpad/этап1/no-clause-common.md.
#
# Всего правил: 120
# По категориям:
#   PRC  (процедура нормоконтроля)            — 9
#   CMP  (состав и комплектование)            — 15
#   ID   (обозначения документов)             — 7
#   OF   (общее оформление листа)             — 5
#   TL   (основные надписи)                   — 7
#   SIG  (подписи и даты)                     — 4
#   GEN  (общие данные по рабочим чертежам)   — 5
#   GR   (графика: оси, размеры, изображения) — 12
#   SPEC (спецификации, ведомости, таблицы)   — 5
#   TXT  (текстовые документы)                — 6
#   REF  (ссылки на НТД, обязательность)      — 7
#   CHG  (внесение изменений)                 — 21
#   EDOC (электронная документация)           — 13
#   BIM  (информационные модели)              — 4
# По автоматизации: deterministic — 76, llm — 39, manual — 5
# По severity: critical — 12, major — 46, minor — 54, remark — 8
# =====================================================================

# ---------------------------------------------------------------------
# PRC — процедура нормоконтроля (ГОСТ 21.002-2014, РД 52.18.617-2015)
# ---------------------------------------------------------------------

- id: COM-PRC-001
  title: Сметная документация вне объёма нормоконтроля
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: remark
  source:
    ntd: ГОСТ 21.002-2014
    clause: "5.1"
  check:
    type: presence
    description: Документы со сметными шифрами (СМ, ЛС) исключаются из объёма проверки нормоконтроля; замечания по оформлению смет модуль не формирует.
  auto: deterministic
  wording: "Сметная документация, входящая в состав проектной и/или рабочей документации, нормоконтролю не подлежит."
  fix_hint: Не предъявлять сметные документы на нормоконтроль; проверка смет ведётся вне модуля (формат XML для экспертизы контролируется правилом COM-EDOC-013).

- id: COM-PRC-002
  title: Подпись нормоконтролёра обязательна до выпуска
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: critical
  source:
    ntd: ГОСТ 21.002-2014
    clause: "6.1, 6.7"
  check:
    type: presence
    description: Проверить наличие подписи в графе «Н. контр.» основной надписи каждого документа; документы без подписи нормоконтролёра не подлежат передаче в архив и выдаче заказчику.
  auto: deterministic
  wording: "Отсутствует подпись нормоконтролёра. Нормоконтроль — завершающий этап разработки документации; передача подлинников в архив без подписи нормоконтролёра не допускается (ГОСТ 21.002-2014, пп. 6.1, 6.7)."
  fix_hint: Предъявить документ на нормоконтроль и получить подпись в графе «Н. контр.» до сдачи в архив/выдачи заказчику.

- id: COM-PRC-003
  title: Комплектное предъявление с подписями ответственных лиц
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ 21.002-2014
    clause: "6.4, 6.6"
  check:
    type: presence
    description: Документация предъявляется комплектно, в оригиналах (подписи «Разраб.», «Пров.») или подлинниках со всеми подписями лиц, ответственных за содержание и выполнение, кроме утверждающей подписи руководителя.
  auto: deterministic
  wording: "Документация предъявлена на нормоконтроль некомплектно либо без установленных подписей лиц, ответственных за её содержание и выполнение (ГОСТ 21.002-2014, пп. 6.4, 6.6)."
  fix_hint: Дособрать комплект и оформить подписи «Разраб.» и «Пров.» (все подписи, кроме утверждающей) до предъявления.

- id: COM-PRC-004
  title: Повторный нормоконтроль изменённой документации
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ 21.002-2014
    clause: "5.2, таблица 1, п. 6; 6.8"
  check:
    type: presence
    description: Для документации с внесёнными изменениями проверить, что на нормоконтроль представлены одновременно разрешение на внесение изменений и подлинники изменённых документов; изменённая документация проходит нормоконтроль повторно.
  auto: deterministic
  wording: "Изменённая документация представлена без разрешения на внесение изменений. На нормоконтроль представляют одновременно разрешение и подлинники изменённых документов (ГОСТ 21.002-2014, таблица 1, п. 6)."
  fix_hint: Приложить разрешение на внесение изменений и предъявить изменённые документы на повторный нормоконтроль.

- id: COM-PRC-005
  title: Замечание сопровождается ссылкой на НТД
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: remark
  source:
    ntd: ГОСТ 21.002-2014
    clause: "7.2"
  check:
    type: format
    description: Мета-правило генератора замечаний — каждое формируемое модулем замечание содержит обозначение нарушенного нормативного документа и номер пункта.
  auto: deterministic
  wording: "Содержание замечаний и предложений должно сопровождаться ссылкой на стандарт, другой нормативный документ, требования которых были нарушены."
  fix_hint: Дополнить замечание ссылкой на конкретный НТД и пункт; замечания без ссылки не выпускать.

- id: COM-PRC-006
  title: Запрет правок в подписанных подлинниках без ведома нормоконтролёра
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ 21.002-2014
    clause: "7.5"
  check:
    type: consistency
    description: Сравнить версию, подписанную нормоконтролёром, с текущей версией подлинника до сдачи в архив; расхождения без отметки нормоконтролёра — нарушение.
  auto: manual
  wording: "В подлинник, подписанный нормоконтролёром, внесены исправления без его ведома. Исправлять и изменять подписанные нормоконтролёром, но не сданные в архив подлинники без его ведома запрещается (ГОСТ 21.002-2014, п. 7.5)."
  fix_hint: Отменить несогласованные правки либо оформить их установленным порядком и предъявить нормоконтролёру повторно.

- id: COM-PRC-007
  title: Возврат без рассмотрения при некомплектности или отсутствии подписей
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: critical
  source:
    ntd: ГОСТ 21.002-2014
    clause: "8.2"
  check:
    type: presence
    description: При нарушении комплектности или отсутствии установленных подписей на титульных листах и в основных надписях проверка прекращается, комплект возвращается разработчику без рассмотрения.
  auto: deterministic
  wording: "Комплект возвращается без рассмотрения: нарушена установленная комплектность документации / отсутствуют установленные подписи на титульных листах и в основных надписях (ГОСТ 21.002-2014, п. 8.2)."
  fix_hint: Восстановить комплектность и оформить подписи, после чего предъявить комплект повторно.

- id: COM-PRC-008
  title: Нормоконтролёр не участвует в разработке проверяемой документации
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: РД 52.18.617-2015
    clause: "5.1"
  check:
    type: consistency
    description: Сравнить фамилии в графах «Разраб.» и «Н. контр.» одного документа — совпадение не допускается.
  auto: deterministic
  wording: "Подписи разработчика и нормоконтролёра принадлежат одному лицу. Нормоконтроль проводится при условии неучастия специалиста в разработке документации, проходящей нормоконтроль (РД 52.18.617-2015, п. 5.1)."
  fix_hint: Передать документ на нормоконтроль специалисту, не участвовавшему в его разработке.

- id: COM-PRC-009
  title: Обоснованность и конкретность замечаний
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: remark
  source:
    ntd: РД 52.18.617-2015
    clause: "6.6"
  check:
    type: format
    description: Мета-правило генератора замечаний — замечание указывает конкретный лист/структурный элемент и содержание несоответствия; замечания по нарушениям действующих НД помечаются как обязательные к исправлению.
  auto: deterministic
  wording: "Замечания нормоконтролёра должны быть обоснованы, носить конкретный характер с указанием наименований и номеров структурных элементов; изменения, обусловленные нарушением действующих НД, обязательны для внесения."
  fix_hint: Формировать замечания с адресацией (лист, элемент) и признаком обязательности.

# ---------------------------------------------------------------------
# CMP — состав и комплектование документации (ПП 87, ПП 145,
#       ГОСТ Р 21.101-2020 разд. 4 и 8.1, приказ 307/пр)
# ---------------------------------------------------------------------

- id: COM-CMP-001
  title: ПД состоит из текстовой и графической частей
  scope: document
  applies_to: [все]
  stage: [П]
  severity: major
  source:
    ntd: ПП РФ от 16.02.2008 № 87
    clause: "3"
  check:
    type: presence
    description: Проверить наличие в каждом разделе ПД текстовой части (описания решений, ссылки на НТД, исходные данные, результаты расчётов) и графической части (или формы информационной модели), а также их взаимную совместимость.
  auto: llm
  wording: "Проектная документация состоит из текстовой и графической частей, содержащих материалы в текстовой и графической формах и (или) в форме информационной модели (ПП РФ № 87, п. 3)."
  fix_hint: Дополнить раздел недостающей текстовой или графической частью.

- id: COM-CMP-002
  title: Обязательные разделы ПД нелинейного объекта
  scope: document
  applies_to: [все]
  stage: [П]
  severity: critical
  source:
    ntd: ПП РФ от 16.02.2008 № 87
    clause: "3(1)"
  check:
    type: presence
    description: Для объектов производственного и непроизводственного назначения сверить перечень представленных разделов с обязательным составом (разделы 1–11, 13; раздел 6 для непроизводственных — при требовании задания; раздел 12 — по п. 3(4)).
  auto: deterministic
  wording: "Нарушен обязательный состав разделов проектной документации: отсутствует раздел, предусмотренный п. 3(1) ПП РФ № 87."
  fix_hint: Разработать и включить в комплект недостающие обязательные разделы.

- id: COM-CMP-003
  title: Обязательные разделы ПД линейного объекта
  scope: document
  applies_to: [все]
  stage: [П]
  severity: critical
  source:
    ntd: ПП РФ от 16.02.2008 № 87
    clause: "3(2)"
  check:
    type: presence
    description: Для линейных объектов сверить перечень представленных разделов с обязательным составом (разделы 1–8, 10; раздел 9 «Смета» — по п. 3(4)).
  auto: deterministic
  wording: "Нарушен обязательный состав разделов проектной документации линейного объекта: отсутствует раздел, предусмотренный п. 3(2) ПП РФ № 87."
  fix_hint: Разработать и включить в комплект недостающие обязательные разделы.

- id: COM-CMP-004
  title: Смета в составе ПД при бюджетном финансировании
  scope: document
  applies_to: [все]
  stage: [П]
  severity: critical
  source:
    ntd: ПП РФ от 16.02.2008 № 87
    clause: "3(4)"
  check:
    type: presence
    description: Если по исходным данным проекта финансирование ведётся из бюджетов бюджетной системы РФ или средств лиц по ст. 8.3 ГрК — проверить наличие раздела «Смета на строительство».
  auto: deterministic
  wording: "Отсутствует раздел «Смета на строительство…», обязательный при финансировании с привлечением средств бюджетной системы РФ (ПП РФ № 87, п. 3(4))."
  fix_hint: Включить сметный раздел в состав ПД.

- id: COM-CMP-005
  title: Состав ПД реконструкции/капремонта по заданию на проектирование
  scope: document
  applies_to: [все]
  stage: [П]
  severity: major
  source:
    ntd: ПП РФ от 16.02.2008 № 87
    clause: "3(3)"
  check:
    type: consistency
    description: Для реконструкции и капремонта сверить перечень разделов комплекта с перечнем, установленным заданием на проектирование.
  auto: llm
  wording: "Состав разделов ПД реконструкции (капитального ремонта) не соответствует заданию на проектирование (ПП РФ № 87, п. 3(3))."
  fix_hint: Привести состав комплекта в соответствие с заданием либо скорректировать задание установленным порядком.

- id: COM-CMP-006
  title: Комплектность и состав документации (общая проверка)
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: critical
  source:
    ntd: ГОСТ 21.002-2014
    clause: "5.2, таблица 1, п. 1а"
  check:
    type: presence
    description: "Комплектность и состав: проектной документации — по требованиям нормативных и правовых документов и задания на проектирование; рабочей — по требованиям стандартов СПДС."
  auto: llm
  wording: "Нарушены комплектность и состав документации: проектная документация должна соответствовать требованиям нормативных и правовых документов и задания на проектирование, рабочая — требованиям стандартов СПДС (ГОСТ 21.002-2014, таблица 1, п. 1а)."
  fix_hint: Восстановить комплектность по нормативным требованиям и заданию на проектирование.

- id: COM-CMP-007
  title: Комплект документов для государственной экспертизы
  scope: document
  applies_to: [все]
  stage: [П]
  severity: critical
  source:
    ntd: ПП РФ от 05.03.2007 № 145
    clause: "13"
  check:
    type: presence
    description: "Сверить комплект, направляемый на госэкспертизу, с п. 13 ПП 145: заявление, ПД в полном составе, ведомости объёмов работ, задание на проектирование, результаты изысканий, задание на изыскания, документы полномочий, документ о передаче ПД застройщику."
  auto: deterministic
  wording: "Комплект документов для проведения государственной экспертизы неполон: отсутствует документ, предусмотренный п. 13 ПП РФ № 145."
  fix_hint: Дособрать комплект по перечню п. 13 ПП 145 до направления на экспертизу.

- id: COM-CMP-008
  title: Задание на проектирование по форме приказа № 307/пр (бюджет)
  scope: document
  applies_to: [все]
  stage: [П]
  severity: major
  source:
    ntd: Приказ Минстроя России от 21.04.2022 № 307/пр (ч. 12.4 ст. 48 ГрК РФ)
    clause: "приказ, приложение (форма задания)"
  check:
    type: format
    description: Для объектов с бюджетным финансированием проверить наличие задания на проектирование и его соответствие обязательной форме приказа № 307/пр (в т.ч. п. 41 — перечень документов по стандартизации).
  auto: deterministic
  wording: "Задание застройщика (технического заказчика) на проектирование объекта с бюджетным финансированием отсутствует или не соответствует форме, утверждённой приказом Минстроя России от 21.04.2022 № 307/пр."
  fix_hint: Оформить задание по обязательной форме приказа № 307/пр.

- id: COM-CMP-009
  title: Порядок комплектования и объём тома ПД
  scope: document
  applies_to: [все]
  stage: [П]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "8.1.2, 8.1.3"
  check:
    type: format
    description: "Проверить порядок комплектования тома (обложка, титульный лист, содержание, состав проектной документации, текстовая часть, графическая часть) и объём тома — как правило, не более 300 листов формата А4."
  auto: deterministic
  wording: "Нарушен порядок комплектования тома либо превышен рекомендуемый объём тома (не более 300 листов формата А4 или эквивалент) (ГОСТ Р 21.101-2020, пп. 8.1.2, 8.1.3)."
  fix_hint: Перекомплектовать том в установленном порядке; при превышении объёма разделить том.

- id: COM-CMP-010
  title: Титульный лист тома по форме 12
  scope: document
  applies_to: [все]
  stage: [П]
  severity: major
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "8.1.4"
  check:
    type: format
    description: К каждому тому ПД выполняется титульный лист по форме 12 (приложение Р) с подписями руководителя или главного инженера организации и лица, ответственного за подготовку документации, в полях 9–11.
  auto: deterministic
  wording: "Титульный лист тома отсутствует, выполнен не по форме 12 либо не оформлен подписями руководителя (главного инженера) организации и лица, ответственного за подготовку проектной документации (ГОСТ Р 21.101-2020, п. 8.1.4)."
  fix_hint: Выполнить титульный лист по форме 12 (приложение Р) и оформить установленные подписи.

- id: COM-CMP-011
  title: Содержание тома по форме 2 с шифром «-С»
  scope: document
  applies_to: [все]
  stage: [П]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "8.1.5"
  check:
    type: format
    description: "При комплектовании в томе двух и более документов проверить наличие содержания по форме 2 (приложение В) на листах А4: последовательность записей, графы, обозначение = обозначение тома + «-С», основная надпись форм 5/6, запись «Содержание тома N» в графе 5."
  auto: deterministic
