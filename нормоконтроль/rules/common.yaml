  wording: "Наименования изображений не соответствуют установленным формам «План…», «Разрез 1–1», «Фасад 1–12» либо подчёркнуты (ГОСТ Р 21.101-2020, пп. 5.5.12, 5.5.14–5.5.16)."
  fix_hint: Привести наименования к установленным формам без подчёркивания.

