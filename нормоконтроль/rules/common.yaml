  wording: "Продолжение таблицы изменений размещено с нарушением: его выполняют вверх или влево от основной надписи (ГОСТ Р 21.101-2020, п. 5.2.6)."
  fix_hint: Разместить продолжение таблицы изменений вверх или влево от основной надписи.

