  wording: "Технические требования размещены с нарушением: их располагают над основной надписью, заголовок не пишут, между техтребованиями и основной надписью изображения и таблицы не помещают (ГОСТ Р 2.316-2023, раздел 6)."
  fix_hint: Перенести технические требования в поле над основной надписью, убрать заголовок.

# ---------------------------------------------------------------------
# SPEC — спецификации, ведомости, таблицы (ГОСТ Р 21.101-2020 разд. 6,
#        ГОСТ 21.002-2014, ГОСТ Р 59750-2021)
# ---------------------------------------------------------------------

- id: COM-SPEC-001
  title: Спецификации по формам 7 и 8
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "6.1"
  check:
    type: format
    description: К схемам расположения элементов конструкций, чертежам расположения оборудования и трубопроводов, планам установок составляются спецификации по формам 7, 8 (приложение К).
  auto: deterministic
  wording: "Спецификация отсутствует или выполнена не по формам 7, 8 (ГОСТ Р 21.101-2020, п. 6.1, приложение К)."
  fix_hint: Составить спецификацию по установленной форме (групповую — по форме 8).

- id: COM-SPEC-002
  title: Табличные документы — графы, показатели, наименования
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ 21.002-2014
    clause: "5.2, таблица 1, п. 3"
  check:
    type: consistency
    description: "Для текстовых документов с графами (спецификации оборудования, опросные листы): соответствие номенклатуры граф установленным формам и правилам заполнения; соответствие показателей и расчётных величин нормативным данным; правильность наименований и обозначений оборудования, изделий, материалов; соответствие оборудования информационным материалам предприятий-изготовителей; соответствие номеров позиций и марок элементов чертежам."
  auto: llm
  wording: "Табличный документ заполнен с нарушениями: номенклатура граф, показатели, наименования и обозначения либо номера позиций не соответствуют установленным формам, нормативным данным и чертежам (ГОСТ 21.002-2014, таблица 1, п. 3)."
  fix_hint: Привести графы, показатели, наименования и позиции в соответствие с формами, нормативами и чертежами.

- id: COM-SPEC-003
  title: Соответствие чертежа спецификациям, УГО и типовой документации
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ 21.002-2014
    clause: "5.2, таблица 1, п. 4"
  check:
    type: consistency
    description: "Для графических документов: правильность применения типовой проектной документации; соответствие наименований, обозначений и количества элементов на чертеже данным спецификаций, перечней, ведомостей; соблюдение стандартов СПДС на условные графические изображения и обозначения."
  auto: llm
  wording: "Данные чертежа не соответствуют спецификациям (перечням, ведомостям) либо нарушены стандарты СПДС на условные графические изображения и обозначения (ГОСТ 21.002-2014, таблица 1, п. 4)."
  fix_hint: Устранить расхождения «чертёж — спецификация» и привести условные обозначения к стандартам СПДС.

- id: COM-SPEC-004
  title: Таблицы в графических документах
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ 21.002-2014
    clause: "5.2, таблица 1, п. 5"
  check:
    type: consistency
    description: "Для таблиц в графических документах (ведомости, спецификации, экспликации, перечни): номенклатура граф по установленным формам; правильность наименований и обозначений; соответствие позиций и марок чертежам; правильность сокращений; соответствие показателей нормативным данным; единицы физических величин."
  auto: llm
  wording: "Таблицы графического документа выполнены с нарушениями форм, наименований, позиций, сокращений или единиц величин (ГОСТ 21.002-2014, таблица 1, п. 5)."
  fix_hint: Привести таблицы к установленным формам и согласовать с данными чертежей.

- id: COM-SPEC-005
  title: Обозначение стандарта на материал в графе «Наименование»
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 59750-2021
    clause: "5.7"
  check:
    type: format
    description: Обозначение стандарта (НД) на материал входит в обозначение материала и указывается в графе «Наименование»; обозначение НД на поставку металлопродукции приводится с годом утверждения.
  auto: llm
  wording: "Обозначение стандарта на материал указано в графе «Обозначение» вместо графы «Наименование» либо приведено без года утверждения (ГОСТ Р 59750-2021, п. 5.7)."
  fix_hint: Перенести обозначение НД на материал в графу «Наименование», указать год утверждения.

# ---------------------------------------------------------------------
# TXT — текстовые документы (ГОСТ Р 21.101-2020 4.1.4, ГОСТ Р 2.105-2019,
#       ГОСТ 21.002-2014, РД 52.18.617-2015)
# ---------------------------------------------------------------------

- id: COM-TXT-001
  title: Текстовые документы по ГОСТ Р 2.105 на листах А4
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "4.1.4"
  check:
    type: format
    description: Текстовые документы со сплошным текстом (текстовые части разделов ПД) выполняются по ГОСТ Р 2.105 на листах формата А4; таблицы и иллюстрации допускаются на форматах по ГОСТ 2.301.
  auto: deterministic
  wording: "Текстовый документ выполнен не по ГОСТ Р 2.105 либо не на листах формата А4 (ГОСТ Р 21.101-2020, п. 4.1.4)."
  fix_hint: Оформить текстовую часть по ГОСТ Р 2.105 на А4; крупноформатные таблицы/иллюстрации — на форматах по ГОСТ 2.301.

- id: COM-TXT-002
  title: Соблюдение стандартов на текстовые документы (общая проверка)
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: ГОСТ 21.002-2014
    clause: "5.2, таблица 1, п. 2"
  check:
    type: format
    description: Для текстовых документов со сплошным текстом (ПЗ, текстовые части разделов, СТУ, расчёты) дополнительно проверяется соблюдение требований стандартов на текстовые документы (в т.ч. СТО организации).
  auto: llm
  wording: "Текстовый документ выполнен с нарушением требований стандартов на текстовые документы (ГОСТ 21.002-2014, таблица 1, п. 2)."
  fix_hint: Привести структуру и оформление текста в соответствие с ГОСТ Р 2.105 и применяемыми СТО.

- id: COM-TXT-003
  title: Размер шрифта основного текста
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 2.105-2019
    clause: "5.1.1"
  check:
    type: format
    description: При автоматизированном выполнении основной текст набирается шрифтом 11–14 пт; для приложений, примечаний, таблиц, сносок и примеров допускается на 1–2 пт меньше; смешение гарнитур в одном документе не рекомендуется.
  auto: deterministic
  wording: "Размер шрифта основного текста выходит за пределы 11–14 пт (ГОСТ Р 2.105-2019, п. 5.1.1)."
  fix_hint: Установить размер основного шрифта 11–14 пт, вспомогательного — на 1–2 пт меньше.

- id: COM-TXT-004
  title: Оформление таблиц текстового документа
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 2.105-2019
    clause: "6.8"
  check:
    type: format
    description: "Таблицы оформляются по подразделу 6.8: нумерация и наименование («Таблица N — Наименование»), ссылки в тексте на все таблицы, заголовки граф с прописной буквы в единственном числе, диагональное деление головки не допускается."
  auto: llm
  wording: "Таблицы текстового документа оформлены с нарушением требований подраздела 6.8 ГОСТ Р 2.105-2019 (нумерация, наименование, ссылки, заголовки граф)."
  fix_hint: Оформить таблицы по подразделу 6.8 ГОСТ Р 2.105-2019.

- id: COM-TXT-005
  title: Правильность применения единиц физических величин
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ 21.002-2014
    clause: "5.2, таблица 1, п. 1и"
  check:
    type: format
    description: Проверить правильность применения системы единиц физических величин (единицы по ГОСТ 8.417, постоянство единицы одного параметра по документу).
  auto: llm
  wording: "Нарушено применение системы единиц физических величин (ГОСТ 21.002-2014, таблица 1, п. 1и)."
  fix_hint: Привести единицы величин к ГОСТ 8.417 и обеспечить их единство по документу.

- id: COM-TXT-006
  title: Идентичность наименований документа во всех местах указания
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: РД 52.18.617-2015
    clause: "7.1 (перечисление д)"
  check:
    type: consistency
    description: Наименование документа (объекта) на листе утверждения, титульном листе, в основной надписи и в тексте документа должно совпадать дословно.
  auto: deterministic
  wording: "Наименование документа на титульном листе, в основной надписи и в тексте не идентично (РД 52.18.617-2015, п. 7.1)."
  fix_hint: Привести наименование к единой формулировке во всех местах указания.

