- id: COM-BIM-001
  title: Имена файлов моделей, слои и цвета
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ 2.111-2013
    clause: "таблица 1, п. 9"
  check:
    type: format
    description: Проверить соответствие обозначений (имён) файлов электронных моделей правилам обозначений организации, правила размещения элементов по слоям и применяемые цвета; полноту и соответствие стандартам чертежей, получаемых из модели.
  auto: deterministic
  wording: "Имена файлов электронных моделей, размещение элементов по слоям или применяемые цвета не соответствуют установленным правилам организации (ГОСТ 2.111-2013, таблица 1, п. 9)."
  fix_hint: Переименовать файлы моделей и привести слои/цвета к правилам организации (СТО).

- id: COM-BIM-002
  title: Единая система координат и масштаб модели 1:1
  scope: document
  applies_to: [все]
  stage: [П]
  severity: major
  source:
    ntd: МР ФАУ «Главгосэкспертиза России» по подготовке информационной модели ОКС
    clause: "7.1"
  check:
    type: numeric
    description: "ИМ выполняется в единой системе координат и отметок: базовый координационный файл, базовая точка проекта с привязкой к фактическим координатам, ориентация на север; моделирование в масштабе 1:1 в метрической системе (мм, м, м², м³; отметки — м)."
  auto: deterministic
  wording: "Информационная модель выполнена не в единой планово-высотной системе координат или не в масштабе 1:1 в метрической системе (МР ГГЭ по подготовке ИМ, п. 7.1)."
  fix_hint: Задать базовую точку и единую систему координат, перевести модель в масштаб 1:1.

- id: COM-BIM-003
  title: Отсутствие коллизий в информационной модели
  scope: document
  applies_to: [все]
  stage: [П]
  severity: major
  source:
    ntd: МР ФАУ «Главгосэкспертиза России» по подготовке информационной модели ОКС
    clause: "7.2"
  check:
    type: consistency
    description: "Содержание ИМ обеспечивает отсутствие коллизий: пересечения элементов (с учётом изоляции), неучёт изоляции трубопроводов, выступающие части на путях эвакуации, отсутствие необходимых конструкций (дверей, окон)."
  auto: deterministic
  wording: "В информационной модели выявлены коллизии: пересечения элементов, неучёт изоляции, препятствия на путях эвакуации или отсутствие необходимых конструкций (МР ГГЭ по подготовке ИМ, п. 7.2)."
  fix_hint: Устранить коллизии и повторить автоматическую проверку модели.

- id: COM-BIM-004
  title: Соответствие модели двухмерной и текстовой документации
  scope: document
  applies_to: [все]
  stage: [П]
  severity: major
  source:
    ntd: МР ФАУ «Главгосэкспертиза России» по подготовке информационной модели ОКС
    clause: "4.8"
  check:
    type: consistency
    description: Разделы ПД в форме слоёв ИМ содержат все необходимые элементы и атрибуты, соответствуют заданию на проектирование и представляемой двухмерной и текстовой документации по разделу, включая технологические отверстия и проёмы.
  auto: llm
  wording: "Информационная модель не соответствует представляемой двухмерной и текстовой документации раздела либо не содержит необходимых элементов и атрибутов (МР ГГЭ по подготовке ИМ, п. 4.8)."
  fix_hint: Синхронизировать модель с чертежами и текстовой частью раздела, дополнить атрибуты.
