  auto: deterministic
  wording: "Сканированный документ выполнен с нарушением: сканирование только с оригинала, разрешение 300 dpi, масштаб 1:1 (приказ № 783/пр, п. 6)."
  fix_hint: Пересканировать документ с оригинала с требуемыми параметрами.

- id: COM-EDOC-009
  title: Подписание электронных документов УКЭП
  scope: document
  applies_to: [все]
  stage: [П]
  severity: critical
  source:
    ntd: Приказ Минстроя России от 12.05.2017 № 783/пр
    clause: "7"
  check:
    type: presence
    description: Представляемые электронные документы подписываются усиленной квалифицированной электронной подписью лиц, обладающих полномочиями на их подписание.
  auto: deterministic
  wording: "Электронные документы не подписаны усиленной квалифицированной электронной подписью уполномоченных лиц (приказ № 783/пр, п. 7)."
  fix_hint: Подписать все файлы УКЭП уполномоченных лиц.

- id: COM-EDOC-010
  title: Пояснительная записка в формате xml-схемы
  scope: document
  applies_to: [ПЗ]
  stage: [П]
  severity: major
  source:
    ntd: Приказ Минстроя России от 12.05.2017 № 783/пр (xml-схема «explanatorynote», версия 01-01)
    clause: "2; описание схемы, разделы 3–5"
  check:
    type: format
    description: Пояснительная записка в электронном виде — один xml-файл в кодировке UTF-8, валидный по схеме explanatorynote-01-01.xsd, с файлами ЭП; обязательные элементы заполнены (шифр, год, генпроектировщик, подписанты, объект, UsedNorms — перечень применённых норм); коды прилагаемых документов — из справочника групп 01–24, 99.
  auto: deterministic
  wording: "Пояснительная записка не соответствует xml-схеме explanatorynote (валидация по xsd, кодировка UTF-8, обязательные элементы, включая UsedNorms)."
  fix_hint: Сформировать xml-ПЗ по действующей схеме, заполнить обязательные элементы, приложить файлы ЭП.

- id: COM-EDOC-011
  title: Сметная документация — только машиночитаемый XML
  scope: document
  applies_to: [СМ]
  stage: [П]
  severity: major
  source:
    ntd: Приказ Минстроя России от 12.05.2017 № 783/пр (письмо Минстроя от 05.05.2023 № 25724-ИФ/00; xml-схема LocalEstimate)
    clause: "2"
  check:
    type: format
    description: С 01.08.2023 сметная документация на экспертизу представляется исключительно в машиночитаемом XML-формате по схемам Минстроя (LocalEstimate); иные форматы не размещаются в ЕГРЗ. Формат проверяется автоматически; содержание смет нормоконтролю не подлежит (см. COM-PRC-001).
  auto: deterministic
  wording: "Сметная документация представлена не в машиночитаемом XML-формате по схеме Минстроя; документы с нарушением Требований ЭД не могут быть размещены в ЕГРЗ (приказ № 783/пр, п. 2)."
  fix_hint: Выгрузить сметы в XML по действующей версии схемы LocalEstimate.

- id: COM-EDOC-012
  title: Единственный подлинник и заверение бумажных копий
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.1003-2009
    clause: "4.7"
  check:
    type: consistency
    description: Подлинник документа существует в одной форме — бумажной с подлинными подписями либо электронной с ЭП; бумажная копия электронного подлинника заверяется установленным порядком (штамп, подпись ответственного лица, дата); взаимно преобразованные документы имеют ссылки друг на друга.
  auto: manual
  wording: "Одновременно обращаются бумажный и электронный подлинники одного документа либо бумажная копия электронного подлинника не заверена установленным порядком (ГОСТ Р 21.1003-2009, п. 4.7)."
  fix_hint: Определить единственную форму подлинника; копии заверять штампом с подписью и датой.

- id: COM-EDOC-013
  title: Соответствие бумажной и электронной форм документа
  scope: document
  applies_to: [все]
  stage: [П, Р]
  severity: minor
  source:
    ntd: ГОСТ Р 21.101-2020
    clause: "5.1.2"
  check:
    type: consistency
    description: При выпуске документа одновременно в бумажной форме и в виде ДЭ их взаимное соответствие обеспечивает разработчик; содержание форм должно быть идентично.
  auto: manual
  wording: "Бумажная и электронная формы документа не идентичны; взаимное соответствие документов в разных формах обеспечивает разработчик (ГОСТ Р 21.101-2020, п. 5.1.2)."
  fix_hint: Синхронизировать содержание бумажной и электронной форм, переиздать отстающую форму.

