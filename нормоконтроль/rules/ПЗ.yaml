# =============================================================================
# ENSO Nexus / модуль «Нормоконтроль» — Этап 1
# Секционный каталог: раздел 1 «Пояснительная записка» (шифр ПЗ)
# Происхождение: извлечения Этапа 0 (D-нпа: ПП 87 с изм. ПП 589, ПП 145,
#   xml-схема explanatorynote-01-01 + описание; A-ядро: справка об изменениях ЦГЭ);
#   пункты ПП 145 (44(2)) подтверждены грепом полного текста в tmp-D.
# Дата сборки: 2026-08-24.
# Счётчик: 6 правил (PZ-001…PZ-006).
# =============================================================================

- id: PZ-001
  title: "Машиночитаемая ПЗ: соответствие xml-схеме explanatorynote"
  scope: document
  applies_to: [ПЗ]
  stage: [П]
  severity: critical
  source:
    ntd: "XML-схема пояснительной записки (explanatorynote-01-01.xsd) и её описание, размещаемые по механизму п.2 приказа Минстроя № 783/пр"
    clause: "описание xml-схемы, п.3–5"
  check:
    type: format
    description: "ПЗ в электронном виде — один xml-файл в кодировке UTF-8 плюс файлы электронных подписей; документ валиден по действующей версии схемы explanatorynote (в наборе — 01-01); при разночтениях описания и xsd приоритет у xsd."
  auto: deterministic
  wording: "Пояснительная записка не соответствует действующей xml-схеме explanatorynote (валидация не пройдена / нарушена кодировка UTF-8 / документ не является единым xml-файлом с файлами ЭП)."
  fix_hint: "Сформировать ПЗ единым xml-файлом (UTF-8) по действующей xml-схеме с сайта Минстроя и приложить файлы электронных подписей."

- id: PZ-002
  title: "Обязательные элементы xml-ПЗ заполнены (включая UsedNorms)"
  scope: document
  applies_to: [ПЗ]
  stage: [П]
  severity: critical
  source:
    ntd: "XML-схема пояснительной записки (explanatorynote-01-01.xsd)"
    clause: "корневой элемент ExplanatoryNote; журнал изменений схемы («Элемент UsedNorms сделан обязательным»)"
  check:
    type: presence
    description: "Заполнены обязательные элементы: шифр ПЗ, год, сведения о генпроектировщике (IssueAuthor), подписанты (Signers), объект (NonIndustrialObject | IndustrialObject | LinearObject), перечень применённых норм (UsedNorms); значения справочных полей — из встроенных справочников схемы (класс энергоэффективности, уровень ответственности, категория пожарной опасности и др.)."
  auto: deterministic
  wording: "В xml-ПЗ не заполнен обязательный элемент схемы explanatorynote (шифр, год, генпроектировщик, подписанты, объект, UsedNorms) либо значение не соответствует справочнику схемы."
  fix_hint: "Заполнить все обязательные элементы xml-ПЗ, перечень применённых норм — в элементе UsedNorms; значения выбирать из справочников схемы."

- id: PZ-003
  title: "Коды прилагаемых к ПЗ документов — по справочнику схемы"
  scope: document
  applies_to: [ПЗ]
  stage: [П]
  severity: major
  source:
    ntd: "Описание xml-схемы пояснительной записки"
    clause: "справочник кодов прилагаемых документов (группы 01–24, 99)"
  check:
    type: format
    description: "Коды прилагаемых документов (ИРД) — из справочника 25 групп описания схемы (01 — основания экспертизы, 04 — подключение к сетям, 05 — задания и программы, 06 — результаты изысканий, 17 — правоустанавливающие, 19 — СТУ, 21 — охрана окружающей среды и санэпид, 99 — дополнительные и т.д.); проверка допустимости кодов и минимальной комплектности прилагаемых документов."
  auto: deterministic
  wording: "Код прилагаемого к ПЗ документа отсутствует в справочнике групп 01–24, 99 описания xml-схемы ПЗ либо обязательный прилагаемый документ не заявлен."
  fix_hint: "Присвоить прилагаемым документам коды из справочника описания xml-схемы ПЗ и дополнить недостающие документы ИРД."

- id: PZ-004
  title: "Перечень документов, обеспечивающих соблюдение требований техрегламентов"
  scope: document
  applies_to: [ПЗ]
  stage: [П]
  severity: major
  source:
    ntd: "ПП РФ от 16.02.2008 № 87 (в ред. ПП № 589 от 06.05.2024, с 01.09.2024)"
    clause: "10 «у»"
  check:
    type: presence
    description: "В ПЗ приведён перечень документов, в результате применения которых обеспечивается соблюдение требований технических регламентов и иных требований п.1 ч.5 ст.49 ГрК, использованных при подготовке ПД (взамен ссылки на отменённый перечень по ПП 815). Для линейных объектов — аналогично п.34 «к»; для газовых сетей до 1,2 МПа — прил.10 п.2 «в»."
  auto: deterministic
  wording: "В Пояснительной записке отсутствует перечень документов, в результате применения которых обеспечивается соблюдение требований технических регламентов (пп. «у» п.10 ПП РФ № 87 в ред. ПП № 589), либо приведена ссылка на отменённый перечень ПП 815."
  fix_hint: "Включить в ПЗ актуальный перечень применённых документов по пп. «у» п.10 ПП РФ № 87; ссылки на перечень ПП 815 исключить."

- id: PZ-005
  title: "Результаты способов обоснования соответствия (ч.6 ст.15 384-ФЗ) в ПЗ"
  scope: document
  applies_to: [ПЗ]
  stage: [П]
  severity: major
  source:
    ntd: "ПП РФ от 16.02.2008 № 87 (в ред. ПП № 589 от 06.05.2024, с 01.09.2024)"
    clause: "10 «б»"
  check:
    type: presence
    description: "При применении способов обоснования соответствия по ч.6 ст.15 384-ФЗ (исследования, расчёты/испытания, моделирование, оценка риска) их результаты отражены в ПЗ (реквизиты), а сами результаты приложены в полном объёме."
  auto: llm
  wording: "В ПЗ не отражены результаты применения способов обоснования соответствия по ч.6 ст.15 384-ФЗ (пп. «б» п.10 ПП РФ № 87 в ред. ПП № 589) при наличии отступлений от документов добровольного применения."
  fix_hint: "Указать в ПЗ реквизиты результатов применённых способов обоснования и приложить результаты в полном объёме."

- id: PZ-006
  title: "Справка об изменениях при повторной экспертизе"
  scope: document
  applies_to: [ПЗ]
  stage: [П]
  severity: major
  source:
    ntd: "ПП РФ от 05.03.2007 № 145 (ред. 15.09.2023)"
    clause: "44(2)"
  check:
    type: presence
    description: "При повторном направлении ПД на экспертизу имеется справка, подписанная главным инженером проекта, с описанием внесённых изменений (по рекомендациям СПб ГАУ «ЦГЭ»: перечень изменённых разделов по ПП 87, влияние на проектные решения и ТЭП, перечень неизменённых разделов, указание о совместимости, таблица изменений; включается в раздел «Пояснительная записка»)."
  auto: deterministic
  wording: "К комплекту повторной экспертизы не приложена справка ГИП с описанием внесённых в ПД изменений (п.44(2) ПП РФ № 145)."
  fix_hint: "Оформить справку об изменениях за подписью ГИП (перечни изменённых/неизменённых разделов, влияние на решения и ТЭП, совместимость) и включить её в раздел «Пояснительная записка»."
