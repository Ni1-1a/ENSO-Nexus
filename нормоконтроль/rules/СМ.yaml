# =============================================================================
# ENSO Nexus / модуль «Нормоконтроль» — Этап 1
# Секционный каталог: сметная документация (шифр СМ; раздел 12/9 по ПП 87)
# Происхождение: извлечения Этапа 0 (D-нпа: приказ 783/пр, xml-схема
#   LocalEstimate-1_07-08.xsd + «Формат представления ЛСР», ПП 145 п.13 «г(1)»;
#   A/C: ГОСТ 21.002-2014 п.5.1, ГОСТ Р 21.101-2020 п.7.3.8, письмо Минстроя
#   № 25724-ИФ/00 об обязательности XML с 01.08.2023).
# Дата сборки: 2026-08-24.
# Счётчик: 7 правил (SM-001…SM-007).
# Примечание: содержательная проверка смет (расценки, объёмы) — вне нормоконтроля
#   (SM-007); каталог покрывает только формат, схему и комплектность.
# =============================================================================

- id: SM-001
  title: "Локальные сметные расчёты — в машиночитаемом XML по схеме Минстроя"
  scope: document
  applies_to: [СМ]
  stage: [П]
  severity: critical
  source:
    ntd: "Приказ Минстроя России от 12.05.2017 № 783/пр"
    clause: "2"
  check:
    type: format
    description: "ЛСР для экспертизы и проверки достоверности сметной стоимости представлены в xml по действующей схеме с сайта Минстроя (в наборе — LocalEstimate версии 1.07); с 01.08.2023 — исключительно машиночитаемый XML (письмо Минстроя от 05.05.2023 № 25724-ИФ/00), иначе документ не размещается в ЕГРЗ."
  auto: deterministic
  wording: "Локальный сметный расчёт представлен не в машиночитаемом XML-формате по действующей схеме Минстроя (п.2 приказа № 783/пр)."
  fix_hint: "Выгрузить ЛСР из сметного ПО в xml по действующей версии схемы LocalEstimate с сайта Минстроя."

- id: SM-002
  title: "Валидность ЛСР по схеме: GUID, код региона, шифры ресурсов"
  scope: document
  applies_to: [СМ]
  stage: [П]
  severity: major
  source:
    ntd: "XML-схема LocalEstimate-1_07-08.xsd («Формат представления локальных сметных расчетов в электронном виде»)"
    clause: "типы TGuid, TRegion, TResCode"
  check:
    type: format
    description: "ЛСР валиден по xsd: глобальный идентификатор расчёта — формат GUID (TGuid); код субъекта РФ — 1–89 (TRegion); шифры ресурсов вне сметно-нормативной базы — по шаблонам TResCode (включая «ТЦ_» для конъюнктурного анализа); заполнены сведения стройки/объекта (Building)."
  auto: deterministic
  wording: "XML-файл ЛСР не проходит валидацию по схеме LocalEstimate: неверный GUID расчёта, код региона вне диапазона 1–89 или шифр ресурса не по шаблону схемы."
  fix_hint: "Исправить реквизиты ЛСР по требованиям схемы (GUID, код региона, шифры ресурсов по шаблонам) и повторить валидацию по xsd."

- id: SM-003
  title: "Индексы пересчёта: либо к элементам затрат, либо к итогу"
  scope: document
  applies_to: [СМ]
  stage: [П]
  severity: major
  source:
    ntd: "«Формат представления локальных сметных расчетов в электронном виде (на основе XML)»"
    clause: "описание типа TPriceIndex"
  check:
    type: numeric
    description: "Индексы пересчёта применяются либо к элементам затрат, либо единым индексом к итоговой стоимости по виду работ (СМР, ремонтно-реставрационные, оборудование, прочие, ПНР, перевозка) — одновременное применение не допускается; округление после перемножения — до 2 знаков; коэффициенты — с обоснованием (Reason)."
  auto: deterministic
  wording: "В ЛСР индекс пересчёта применён одновременно к элементам затрат и к итоговой сметной стоимости, что не допускается форматом представления ЛСР (тип TPriceIndex)."
  fix_hint: "Оставить один способ применения индексов (к элементам затрат или единый к итогу по виду работ); указать обоснование коэффициентов."

- id: SM-004
  title: "Форматы прочих сметных документов при отсутствии xml-схемы"
  scope: document
  applies_to: [СМ]
  stage: [П]
  severity: major
  source:
    ntd: "Приказ Минстроя России от 12.05.2017 № 783/пр"
    clause: "3 «в»"
  check:
    type: format
    description: "Сметные документы, для которых xml-схема не утверждена (сводка затрат, сводный сметный расчёт, объектные расчёты, расчёты на отдельные виды затрат), представляются в форматах xls, xlsx или ods."
  auto: deterministic
  wording: "Сметный документ без утверждённой xml-схемы представлен не в формате xls/xlsx/ods (п.3 «в» приказа № 783/пр)."
  fix_hint: "Представить сводки затрат, ССРСС, объектные и прочие расчёты в формате xls/xlsx/ods (до утверждения соответствующей xml-схемы)."

- id: SM-005
  title: "Изменения смет — только заменой всего документа"
  scope: document
  applies_to: [СМ]
  stage: [П, Р]
  severity: minor
  source:
    ntd: "ГОСТ Р 21.101-2020"
    clause: "7.3.8"
  check:
    type: format
    description: "Изменения в сметную документацию вносят автоматизированным способом с заменой всего документа (новая версия файла); рукописные правки и частичная замена листов смет не допускаются."
  auto: deterministic
  wording: "Изменения в сметную документацию внесены без замены всего документа (ГОСТ Р 21.101-2020, п.7.3.8)."
  fix_hint: "Выпустить новую версию сметного документа целиком (автоматизированная замена), отразив изменение установленным порядком."

- id: SM-006
  title: "Ведомости объёмов работ, учтённых в сметных расчётах"
  scope: document
  applies_to: [СМ]
  stage: [П]
  severity: major
  source:
    ntd: "ПП РФ от 05.03.2007 № 145 (ред. 15.09.2023)"
    clause: "13 «г(1)»"
  check:
    type: presence
    description: "В комплекте на государственную экспертизу присутствуют ведомости объёмов работ, учтённых в сметных расчётах (сопоставимость: каждой смете соответствует ведомость объёмов)."
  auto: deterministic
  wording: "В комплекте отсутствуют ведомости объёмов работ, учтённых в сметных расчётах (пп. «г(1)» п.13 ПП РФ № 145)."
  fix_hint: "Приложить к сметной документации ведомости объёмов работ, учтённых в сметных расчётах, по каждому расчёту."

- id: SM-007
  title: "Границы нормоконтроля: содержание смет не проверяется"
  scope: document
  applies_to: [СМ]
  stage: [П, Р]
  severity: remark
  source:
    ntd: "ГОСТ 21.002-2014"
    clause: "5.1"
  check:
    type: presence
    description: "Сметная документация в составе ПД/РД нормоконтролю не подлежит: модуль проверяет только формат файлов (SM-001…SM-005), комплектность (SM-006) и внешнее оформление, но не расценки, объёмы и стоимость. Замечания по содержанию смет не формируются."
  auto: manual
  wording: "Справочно: содержательная проверка сметной документации не входит в предмет нормоконтроля (ГОСТ 21.002-2014, п.5.1); проверены только формат и комплектность."
  fix_hint: "Содержательные вопросы по сметам адресовать сметному отделу/проверке достоверности сметной стоимости, не нормоконтролю."
