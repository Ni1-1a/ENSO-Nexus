    description: "Проверить наличие документов по п.13: заявление с идентификационными сведениями; ПД в полном составе; ведомости объёмов работ, учтённых в сметных расчётах (п.13 «г(1)»); задание на проектирование (п.13 «д»); результаты инженерных изысканий (п.13 «е»); задание на выполнение изысканий (п.13 «ж»); документы полномочий; документ о передаче ПД застройщику. Для частных случаев — п.13(1)–16(4)."
  auto: deterministic
  wording: "Комплект на государственную экспертизу неполон: отсутствует документ, предусмотренный п.13 Положения о порядке организации и проведения ГЭ (ПП РФ № 145)."
  fix_hint: "Дополнить комплект недостающими документами по п.13 ПП РФ № 145 (задание на проектирование, задание на изыскания, РИИ, ведомости объёмов работ и др.)."

