  auto: deterministic
  wording: "Состав ПД для сети газораспределения/газопотребления давлением до 1,2 МПа не соответствует перечню из 7 разделов, установленному приложением № 10 к ПП РФ № 87."
  fix_hint: "Скомплектовать ПД по перечню приложения № 10 к ПП РФ № 87 (7 разделов; условия разработки отдельных разделов — п.4–6, 8 приложения)."

- id: CS-COMP-007
