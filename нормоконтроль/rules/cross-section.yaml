  auto: llm
  wording: "Разработка ПД на отдельный этап строительства не обоснована: отсутствует расчётное обоснование возможности этапа и/или указание этапа в задании на проектирование (п.8 ПП РФ № 87)."
  fix_hint: "Включить расчётное обоснование возможности выделения этапа и отразить этап в задании на проектирование; укомплектовать ПД этапа в полном составе."

- id: CS-COMP-008
  title: "Комплект, представляемый на государственную экспертизу"
  scope: cross_section
  applies_to: [все]
  stage: [П]
  severity: critical
  source:
    ntd: "ПП РФ от 05.03.2007 № 145 (ред. 15.09.2023)"
