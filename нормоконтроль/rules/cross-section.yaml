# --- CS-COMP: состав и комплектность комплекта (ПП РФ № 87, ПП РФ № 145) -----

- id: CS-COMP-001
  title: "Полный состав разделов ПД (объекты производственного и непроизводственного назначения)"
  scope: cross_section
  applies_to: [все]
  stage: [П]
  severity: critical
  source:
    ntd: "ПП РФ от 16.02.2008 № 87 (ред. 15.09.2023)"
    clause: "3(1)"
  check:
    type: presence
    description: "Сверить перечень разделов комплекта с обязательным перечнем п.3(1): разделы 1–11 и 13 присутствуют; раздел 6 «Технологические решения» для объектов непроизводственного назначения — только при наличии требования в задании на проектирование; раздел 12 «Смета» — по условию п.3(4) (см. CS-COMP-003)."
  auto: deterministic
  wording: "В составе проектной документации отсутствует обязательный раздел, предусмотренный п.3(1) Положения о составе разделов ПД (ПП РФ № 87)."
  fix_hint: "Дополнить комплект недостающими разделами по перечню п.3(1) ПП РФ № 87 либо обосновать неприменимость (вид объекта, задание на проектирование)."

