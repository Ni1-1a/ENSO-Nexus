- id: CS-COMP-010
  title: "Исключение: документация технического перевооружения ОПО"
  scope: cross_section
  applies_to: [все]
  stage: [П, Р]
  severity: remark
  source:
    ntd: "ФЗ от 21.07.1997 № 116-ФЗ"
    clause: "ч.1 ст.8, ч.1 ст.13"
  check:
    type: presence
    description: "Если комплект — документация на техническое перевооружение ОПО без реконструкции/капремонта: требования ПП 87 к составу разделов не применять; проверить наличие экспертизы промышленной безопасности документации (если она не входит в состав ПД, подлежащей экспертизе по ст.49 ГрК). Разъяснения Ростехнадзора (письмо от 25.06.2019 № 09-00-04/5136) и Минстроя."
  auto: manual
  wording: "Документация технического перевооружения ОПО не подлежит проверке на состав по ПП РФ № 87; при этом отсутствует подтверждение экспертизы промышленной безопасности (ч.1 ст.8, ч.1 ст.13 116-ФЗ)."
  fix_hint: "Не требовать состав по ПП 87; обеспечить проведение экспертизы промышленной безопасности документации на техперевооружение ОПО."

- id: CS-COMP-011
  title: "ИРД и согласования — в пределах исчерпывающего перечня"
  scope: cross_section
  applies_to: [все]
  stage: [П]
  severity: remark
  source:
    ntd: "ПП РФ от 25.12.2021 № 2490"
    clause: "1"
  check:
    type: reference
    description: "Перечень исходно-разрешительных документов, сведений и согласований, на которые опирается или которые требует комплект, сверить с исчерпывающим перечнем ПП 2490 (позиции по этапам реализации проекта): требование документов вне перечня недопустимо. Текст перечня — OCR скана, позиции сверять выборочно."
  auto: manual
  wording: "Затребованный документ (сведение, согласование) отсутствует в исчерпывающем перечне, утверждённом ПП РФ от 25.12.2021 № 2490 (п.1): требование документов вне перечня недопустимо."
  fix_hint: "Исключить требование документов вне исчерпывающего перечня ПП 2490 либо указать позицию перечня, которой документ соответствует."

# --- CS-CONS: межразделовая согласованность -----------------------------------

- id: CS-CONS-001
  title: "Совместимость технических решений разделов между собой"
  scope: cross_section
  applies_to: [все]
  stage: [П, Р]
  severity: critical
  source:
    ntd: "ПП РФ от 16.02.2008 № 87 (ред. 15.09.2023)"
    clause: "3"
  check:
    type: consistency
    description: "Принятые в ПД технические и иные решения совместимы друг с другом: технологическая возможность совместной реализации при строительстве и возможность эксплуатации объекта. Искать прямые противоречия решений смежных разделов (АР↔КР↔ИОС↔ТХ↔ПОС): взаимоисключающие конструктивы, несогласованные проёмы/отверстия, несовместимые инженерные трассировки."
  auto: llm
  wording: "Технические решения разделов несовместимы между собой (абзац пятый п.3 ПП РФ № 87): [указать конкретные противоречащие решения и разделы]."
  fix_hint: "Согласовать противоречащие решения смежных разделов и внести взаимоувязанные изменения во все затронутые документы."

- id: CS-CONS-002
  title: "Единство наименования объекта во всех документах комплекта"
  scope: cross_section
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: "РД 52.18.617-2015"
    clause: "7.1 «д»"
  check:
    type: consistency
    description: "Наименование объекта (и документа) идентично на листе утверждения, титульном листе, в основной надписи и в тексте — сверка по всем разделам/томам комплекта. Дополнительная опора: ГОСТ 21.002-2014, п.5.2, таблица 1, п.1в (правильность заполнения основной надписи)."
  auto: llm
  wording: "Наименование объекта (документа) в разделах комплекта различается (титульные листы, основные надписи, текстовые части), что нарушает требование идентичности наименований (РД 52.18.617-2015, п.7.1 «д»)."
  fix_hint: "Привести наименование объекта к единой редакции (как в задании на проектирование) во всех титульных листах, основных надписях и текстах разделов."

- id: CS-CONS-003
  title: "Единая система координационных осей здания во всех разделах"
  scope: cross_section
  applies_to: [АР, КР, ИОС, ТХ]
  stage: [П, Р]
  severity: major
  source:
    ntd: "ГОСТ Р 21.101-2020"
    clause: "5.3.2"
  check:
    type: consistency
    description: "Каждому зданию/сооружению присвоена самостоятельная система обозначений координационных осей; обозначения и положение осей несущих конструкций идентичны на планах всех разделов и основных комплектов (АР↔КР↔ИОС↔ТХ). Последовательность обозначений — по 5.3.3."
  auto: llm
  wording: "Обозначения (положение) координационных осей на чертежах смежных разделов не совпадают: нарушено единство системы обозначения осей здания (ГОСТ Р 21.101-2020, п.5.3.2)."
  fix_hint: "Привести обозначения и привязки координационных осей во всех разделах к единой системе осей здания (сооружения)."

- id: CS-CONS-004
  title: "Единая нулевая отметка и согласованность отметок уровней"
  scope: cross_section
  applies_to: [АР, КР, ИОС, ПЗУ]
  stage: [П, Р]
  severity: major
  source:
    ntd: "ГОСТ Р 21.101-2020"
    clause: "5.4.3"
  check:
    type: consistency
    description: "Условная нулевая отметка (как правило, уровень чистого пола 1-го этажа) едина для всех разделов; отметки уровней указаны в метрах с тремя десятичными знаками; абсолютная отметка, принятая за нулевую, указана в общих указаниях (4.3.5) и совпадает между комплектами и с планировочными отметками ПЗУ."
  auto: llm
  wording: "Отметки уровней (нулевая отметка) в смежных разделах не согласованы: абсолютная отметка, принятая за ±0,000, различается между комплектами (ГОСТ Р 21.101-2020, п.5.4.3)."
  fix_hint: "Установить единую нулевую отметку, указать её абсолютное значение в общих указаниях каждого комплекта и выверить отметки уровней во всех разделах."

- id: CS-CONS-005
  title: "Единая планово-высотная система координат трёхмерных моделей"
  scope: cross_section
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
