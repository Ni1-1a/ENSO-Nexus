    clause: "3(4)"
  check:
    type: presence
    description: "Если строительство финансируется за счёт средств бюджетов бюджетной системы РФ или средств лиц по ст.8.3 ГрК (признак — источник финансирования в задании/заявлении на экспертизу), в составе ПД должен быть раздел «Смета на строительство…»."
  auto: deterministic
  wording: "При финансировании за счёт средств бюджетной системы РФ (ст.8.3 ГрК) в составе ПД отсутствует раздел «Смета на строительство», обязательный по п.3(4) ПП РФ № 87."
  fix_hint: "Включить в комплект раздел «Смета на строительство…» либо документально подтвердить внебюджетный источник финансирования."

