    description: "Трёхмерные (3D) электронные модели здания/сооружения всех разделов выполнены в единой планово-высотной системе координат (сравнение систем координат и высотных отметок файлов моделей)."
  auto: deterministic
  wording: "Трёхмерные модели разделов выполнены в разных планово-высотных системах координат (ГОСТ Р 21.101-2020, п.5.3.8)."
  fix_hint: "Привести все модели к единой планово-высотной системе координат проекта (единая базовая точка и система высот)."

- id: CS-CONS-006
  title: "Одновременное изменение всех взаимосвязанных документов"
  scope: cross_section
  applies_to: [все]
  stage: [П, Р]
  severity: critical
  source:
    ntd: "ГОСТ Р 21.101-2020"
    clause: "7.1.4"
  check:
    type: consistency
    description: "Любое изменение в документе, вызывающее изменения в других документах, сопровождается одновременным внесением соответствующих изменений во все взаимосвязанные документы (смежные разделы, спецификации, ведомости, общие данные). Проверять: изменённый документ ↔ перечень взаимосвязанных документов ↔ наличие в них корреспондирующих изменений."
  auto: llm
