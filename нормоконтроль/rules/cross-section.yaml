  wording: "Структура пакета электронных документов не соответствует ГОСТ Р 21.101-2020 (п.8.2.1–8.2.6): отсутствует info.xml/GUID документов, папки не соответствуют разделам, нарушены правила наименования файлов."
  fix_hint: "Скомплектовать ПДЭ по разделу 8.2 ГОСТ Р 21.101-2020: info.xml, GUID документов, папки по разделам/маркам, имена файлов через «_»."

