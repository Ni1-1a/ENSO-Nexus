  auto: deterministic
  wording: "Состав разделов ПД на реконструкцию (капитальный ремонт) не соответствует перечню, установленному заданием на проектирование (п.3(3) ПП РФ № 87)."
  fix_hint: "Привести перечень разделов комплекта в соответствие заданию на проектирование либо откорректировать задание у заказчика."

