# --- CS-NTD: ссылки на НТД и обязательность требований --------------------------

- id: CS-NTD-001
  title: "Ссылки во всех разделах — только на действующие НТД"
  scope: cross_section
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: "ГОСТ 21.002-2014"
    clause: "5.2, таблица 1, п.1е"
  check:
    type: reference
    description: "Наличие и правильность ссылок на технические регламенты, стандарты и иные нормативные документы: документ существует, реквизиты верны, ссылка на действующую редакцию (не отменён/не заменён). Дополнительная опора: РД 52.18.617-2015, п.7.1 «ж» (актуальность ссылочных НД); ГОСТ 21.002-2014, п.8.1 (руководствоваться только действующими НД)."
  auto: deterministic
  wording: "Ссылка на нормативный документ некорректна: документ отменён, заменён или реквизиты (обозначение, год) указаны неверно (ГОСТ 21.002-2014, п.5.2, таблица 1, п.1е)."
  fix_hint: "Заменить ссылку на действующую редакцию нормативного документа по реестру НТД; проверить реквизиты обозначения."

- id: CS-NTD-002
  title: "Выбор редакции обязательного перечня по дате начала разработки ПД"
  scope: cross_section
  applies_to: [все]
  stage: [П]
  severity: major
  source:
    ntd: "ПП РФ от 28.05.2021 № 815 (в ред. ПП от 20.05.2022 № 914)"
    clause: "2"
  check:
    type: reference
    description: "Применяемая редакция перечня обязательного применения зависит от даты начала разработки ПД: до 01.08.2020 — ПП 1521 (или ПП 815 по выбору застройщика); 01.08.2020–01.09.2021 — ПП 985 (или ПП 815 по выбору); 01.09.2021–01.09.2022 — ПП 815 до/после ред. ПП 914 по выбору. С 01.09.2024 перечень ПП 815 утратил силу (ПП 589; реестр обязательных требований — ПП 1417) — сверять применимость по дате."
  auto: deterministic
  wording: "Оценка обязательности требований выполнена по редакции перечня, не соответствующей дате начала разработки ПД (п.2 ПП РФ № 815 в ред. ПП № 914)."
  fix_hint: "Определить дату начала разработки ПД и применять соответствующую ей редакцию перечня обязательного применения (либо реестр обязательных требований — для ПД после 01.09.2024)."

- id: CS-NTD-003
  title: "Неприменение добровольных документов — не нарушение; нужна альтернатива"
  scope: cross_section
  applies_to: [все]
  stage: [П, Р]
  severity: major
  source:
    ntd: "ФЗ от 27.12.2002 № 184-ФЗ; ФЗ от 30.12.2009 № 384-ФЗ"
    clause: "ч.4 ст.16.1 (184-ФЗ); ч.6 ст.15 (384-ФЗ)"
  check:
    type: consistency
    description: "Неприменение документов добровольного перечня не оценивается как несоблюдение техрегламента; при отступлении от добровольных документов соответствие обосновано одним из способов ч.6 ст.15 384-ФЗ: результаты исследований; расчёты/испытания по сертифицированным или апробированным методикам; моделирование сценариев; оценка риска. Замечание формулируется как отсутствие обоснования, а не как «нарушение СП»."
  auto: manual
  wording: "Отступление от положений документа добровольного применения не подкреплено обоснованием соответствия по ч.6 ст.15 384-ФЗ (исследования, расчёты, моделирование, оценка риска); само неприменение документа нарушением не является (ч.4 ст.16.1 184-ФЗ)."
  fix_hint: "Приложить обоснование соответствия одним из способов ч.6 ст.15 384-ФЗ либо применить документ из перечня добровольного применения."

- id: CS-NTD-004
